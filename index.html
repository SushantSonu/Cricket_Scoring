<style>
  :root{
    --ink:#1c2521;
    --ink-soft:#5b655e;
    --paper:#f6f3ea;
    --card:#ffffff;
    --card-line:#e4ddc9;
    --line:#ddd5c0;
    --turf:#2f6b4f;
    --turf-strong:#1f4d38;
    --turf-tint:#e7f0e8;
    --ball:#b23a2e;
    --ball-tint:#f8e6e2;
    --bail:#a9701c;
    --bail-tint:#f5ead4;
    --info-blue:#2f5f8a;
    --info-blue-tint:#e7eef5;
    --info-purple:#6b4a94;
    --info-purple-tint:#efe7f5;
    --info-teal:#1f7a6c;
    --info-teal-tint:#e2f2ee;
    --chip-glass:rgba(255,255,255,0.55);
    --shadow:rgba(28,37,33,0.10);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#eef0e8;
      --ink-soft:#a6b0a8;
      --paper:#10140f;
      --card:#171d17;
      --card-line:#293025;
      --line:#2a3226;
      --turf:#5aab7c;
      --turf-strong:#7fcb9d;
      --turf-tint:#1a2b21;
      --ball:#e2685a;
      --ball-tint:#2e1c19;
      --bail:#dba53f;
      --bail-tint:#2c2313;
      --info-blue:#7bb0e8;
      --info-blue-tint:#182533;
      --info-purple:#bd9bde;
      --info-purple-tint:#241c2c;
      --info-teal:#5fd0b8;
      --info-teal-tint:#132821;
      --chip-glass:rgba(0,0,0,0.28);
      --shadow:rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --ink:#eef0e8; --ink-soft:#a6b0a8; --paper:#10140f; --card:#171d17; --card-line:#293025;
    --line:#2a3226; --turf:#5aab7c; --turf-strong:#7fcb9d; --turf-tint:#1a2b21;
    --ball:#e2685a; --ball-tint:#2e1c19; --bail:#dba53f; --bail-tint:#2c2313; --shadow:rgba(0,0,0,0.45);
    --info-blue:#7bb0e8; --info-blue-tint:#182533; --info-purple:#bd9bde; --info-purple-tint:#241c2c;
    --info-teal:#5fd0b8; --info-teal-tint:#132821; --chip-glass:rgba(0,0,0,0.28);
  }
  :root[data-theme="light"]{
    --ink:#1c2521; --ink-soft:#5b655e; --paper:#f6f3ea; --card:#ffffff; --card-line:#e4ddc9;
    --line:#ddd5c0; --turf:#2f6b4f; --turf-strong:#1f4d38; --turf-tint:#e7f0e8;
    --ball:#b23a2e; --ball-tint:#f8e6e2; --bail:#a9701c; --bail-tint:#f5ead4; --shadow:rgba(28,37,33,0.10);
    --info-blue:#2f5f8a; --info-blue-tint:#e7eef5; --info-purple:#6b4a94; --info-purple-tint:#efe7f5;
    --info-teal:#1f7a6c; --info-teal-tint:#e2f2ee; --chip-glass:rgba(255,255,255,0.55);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:
      repeating-linear-gradient(to bottom, transparent 0 39px, var(--line) 39px 40px),
      var(--paper);
    color:var(--ink);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
  }
  .shell{
    position:relative;
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    box-shadow:0 0 40px var(--shadow);
  }
  button{ font-family:inherit; -webkit-tap-highlight-color:transparent; }
  input{ font-family:inherit; }
  button:focus-visible, input:focus-visible, a:focus-visible{
    outline:2px solid var(--turf);
    outline-offset:2px;
  }
  .topbar{
    position:sticky; top:0; z-index:5;
    background:var(--paper);
    border-bottom:1px solid var(--card-line);
    padding:14px 18px 12px;
  }
  .topbar-row{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .match-title{
    font-weight:800;
    font-size:15px;
    letter-spacing:0.02em;
    text-transform:uppercase;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .innings-pill{
    appearance:none; border:none; cursor:pointer; font-family:inherit;
    flex-shrink:0;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--turf-strong);
    background:var(--turf-tint);
    border-radius:20px;
    padding:4px 10px;
    white-space:nowrap;
  }
  .innings-pill:hover{ filter:brightness(0.95); }
  .innings-pill.locked{ cursor:default; color:var(--ink-soft); background:var(--card-line); }
  .innings-pill.locked:hover{ filter:none; }
  .icon-btn{
    flex-shrink:0; appearance:none; border:1px solid var(--card-line); background:transparent;
    color:var(--ink-soft); border-radius:8px; width:32px; height:32px; font-size:15px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn:hover{ border-color:var(--ink-soft); color:var(--ink); }
  .icon-btn.live-active{ border-color:#e0362f; color:#e0362f; }

  .live-view{ padding-bottom:40px; }
  .live-badge{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700;
    letter-spacing:0.04em; color:#e0362f; margin-bottom:12px;
  }
  .live-dot{
    width:8px; height:8px; border-radius:50%; background:#e0362f;
    animation: live-pulse 1.4s ease-in-out infinite;
  }
  @keyframes live-pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }
  .live-install-banner{
    position: sticky; bottom: 0; display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:12px 16px; background:var(--card); border-top:1px solid var(--card-line);
    font-size:13px;
  }
  .live-install-banner .btn-ghost{ padding:8px 14px; white-space:nowrap; }
  .bowler-line{ font-size:13px; color:var(--ink-soft); margin:4px 0 12px; }

  .hero{
    position: relative;
    background: radial-gradient(circle at 32% 26%, #f7b044 0%, #c96a1f 52%, #5e2e10 100%);
    padding: 40px 24px 32px;
    text-align: center;
    color: #fff;
  }
  .boot-splash{
    position: fixed; inset: 0; z-index: 9999;
    min-height: 100vh; min-height: 100dvh;
    display: flex; justify-content: center;
    background: radial-gradient(circle at 32% 26%, #f7b044 0%, #c96a1f 52%, #5e2e10 100%);
    cursor: pointer;
    overflow: hidden;
  }
  .boot-splash-img{
    position: relative; width: 100%; max-width: 460px; height: 100%;
    background: url("splash-batsman.png") center top / cover no-repeat;
  }
  .boot-splash-title{
    position: absolute; left: 0; right: 0; bottom: 5%; text-align: center;
    font-weight: 800; line-height: 1.02;
  }
  .boot-splash-title .line1, .boot-splash-title .line2{
    font-size: min(10.1vw, 46px); letter-spacing: -0.01em;
    text-shadow: 0 3px 10px rgba(0,0,0,0.5);
    opacity: 0;
    animation: bootTitleIn 0.5s ease forwards;
    animation-delay: 0.4s;
  }
  .boot-splash-title .line1{ color: #fff; }
  .boot-splash-title .line2{ color: #7fe0c4; animation-delay: 0.55s; }
  @keyframes bootTitleIn{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .boot-splash-title .line1, .boot-splash-title .line2{ animation: none; opacity: 1; transform: none; }
  }
  .hero-menu-btn, .hero-bell-btn, .hero-theme-btn{
    position: absolute;
    appearance: none; cursor: pointer;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.35);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    color: #fff; font-size: 17px;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s ease, background .15s ease;
  }
  .hero-menu-btn{ top: 14px; left: 14px; }
  .hero-bell-btn{ top: 14px; right: 14px; }
  .hero-theme-btn{ top: 14px; right: 64px; }
  .hero-menu-btn svg{ width: 18px; height: 18px; display: block; }
  .hero-menu-btn:hover, .hero-bell-btn:hover, .hero-theme-btn:hover{ background: rgba(255,255,255,0.28); }
  .hero-menu-btn:active, .hero-bell-btn:active{ transform: scale(0.92); }
  .hero-bell-btn .notif-dot{
    position: absolute; top: 6px; right: 6px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--ball, #e2685a); border: 1.5px solid rgba(0,0,0,0.3);
  }
  .home-chat-btn{
    position: absolute;
    bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    right: 18px;
    width: 56px; height: 56px; border-radius: 50%;
    appearance: none; border: none; cursor: pointer;
    background: var(--turf); color: #fff; font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3); z-index: 5;
  }
  .home-chat-btn:hover{ filter: brightness(1.06); }
  .home-chat-btn:active{ transform: scale(0.94); }
  .menu-list{ display: flex; flex-direction: column; gap: 10px; }
  .menu-item{
    display: flex; align-items: center; gap: 12px;
    background: var(--accent-tint, var(--card)); border: 1.5px solid var(--card-line); border-radius: 10px;
    padding: 12px 16px; font-size: 14.5px; font-weight: 700; color: var(--ink);
    cursor: pointer; text-align: left; width: 100%;
  }
  .menu-item:hover{ border-color: var(--accent, var(--turf)); }
  .menu-item .menu-ico-chip{
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    background: var(--chip-glass);
    box-shadow: inset 0 0 0 1.5px var(--accent, var(--turf));
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .menu-item .menu-arrow{ margin-left: auto; color: var(--accent, var(--ink-soft)); font-weight: 700; }
  .btn-back{
    width: 100%; padding: 11px 12px;
    background: var(--ink); color: var(--paper); border: none;
    font-size: 14px; font-weight: 700;
  }
  .btn-back:hover{ filter: brightness(1.15); }
  .lang-toggle{ display: flex; gap: 8px; margin: -6px 0 14px; }
  .extras-toggle-row{ display: flex; flex-wrap: wrap; gap: 8px; }
  .extras-toggle-row .lang-btn{ flex: 1 1 auto; }
  .lang-btn{
    appearance: none; cursor: pointer; flex: 1;
    border: 1.5px solid var(--card-line); background: var(--card); color: var(--ink-soft);
    border-radius: 20px; padding: 7px 12px; font-size: 13px; font-weight: 700;
  }
  .lang-btn.active{ background: var(--turf); color: #fff; border-color: var(--turf); }
  .info-body{ font-size: 14px; line-height: 1.7; color: var(--ink); }
  .info-body p{ margin: 0 0 14px; }
  .info-body ol, .info-body ul{ margin: 0 0 14px; padding-left: 20px; }
  .info-body li{ margin-bottom: 8px; }
  .contact-row{
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0; border-top: 1px solid var(--card-line);
    font-size: 14.5px; font-weight: 600;
  }
  .contact-row:first-of-type{ border-top: none; }
  .contact-row .contact-ico{ font-size: 18px; flex-shrink: 0; }
  .contact-row a{ color: var(--turf-strong); text-decoration: none; }
  .contact-row a:hover{ text-decoration: underline; }
  @keyframes boundaryPop{
    0%{ transform: translate(-50%,-50%) scale(0.3) rotate(-10deg); opacity: 0; }
    18%{ transform: translate(-50%,-50%) scale(1.18) rotate(4deg); opacity: 1; }
    32%{ transform: translate(-50%,-50%) scale(1) rotate(0deg); opacity: 1; }
    78%{ transform: translate(-50%,-50%) scale(1); opacity: 1; }
    100%{ transform: translate(-50%,-50%) scale(1.35); opacity: 0; }
  }
  .boundary-popup{
    position: fixed; top: 38%; left: 50%; transform: translate(-50%,-50%);
    z-index: 60; pointer-events: none; text-align: center;
    animation: boundaryPop 1.15s ease-out forwards;
  }
  .boundary-popup .boundary-num{
    font-size: 130px; font-weight: 900; line-height: 1;
    text-shadow: 0 6px 22px rgba(0,0,0,0.45);
  }
  .boundary-popup .boundary-label{
    font-size: 26px; font-weight: 800; letter-spacing: 0.08em; margin-top: 2px;
    text-shadow: 0 3px 12px rgba(0,0,0,0.45);
  }
  .boundary-popup.four .boundary-num, .boundary-popup.four .boundary-label{ color: var(--turf-strong); }
  .boundary-popup.six .boundary-num, .boundary-popup.six .boundary-label{ color: var(--bail); }
  .boundary-popup.wicket .boundary-num, .boundary-popup.wicket .boundary-label{ color: var(--ball); }
  .toss-coin-wrap{ display:flex; flex-direction:column; align-items:center; gap:10px; margin: 6px 0 22px; }
  .toss-coin{
    width: 92px; height: 92px; position: relative; perspective: 600px;
    cursor: pointer; appearance: none; border: none; background: transparent; padding: 0;
  }
  .toss-coin-inner{
    width:100%; height:100%; position:relative; transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(.2,.8,.2,1);
  }
  .coin-face{
    position:absolute; inset:0; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:28px; letter-spacing:0.04em; color:#fff;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3), inset 0 0 0 3px rgba(255,255,255,0.35);
  }
  .coin-heads{ background: linear-gradient(145deg, var(--bail), #a9701c); }
  .coin-tails{ background: linear-gradient(145deg, var(--turf), var(--turf-strong)); transform: rotateY(180deg); }
  .toss-coin-hint{ font-size:12.5px; color:var(--ink-soft); min-height:16px; }
  .toss-coin-result{ font-weight:800; font-size:16px; min-height:20px; }
  @media (prefers-reduced-motion: reduce){
    .toss-coin-inner{ transition: none; }
  }
  @media (prefers-reduced-motion: reduce){
    .boundary-popup{ animation: none; opacity: 1; }
  }
  .chat-messages{
    display: flex; flex-direction: column; gap: 10px;
    max-height: 48vh; overflow-y: auto; padding: 2px 2px 4px;
  }
  .chat-bubble{ max-width: 84%; padding: 10px 13px; border-radius: 12px; font-size: 13.5px; line-height: 1.5; }
  .chat-bubble-user{ align-self: flex-end; background: var(--turf); color: #fff; border-bottom-right-radius: 3px; }
  .chat-bubble-bot{ align-self: flex-start; background: var(--paper); border: 1px solid var(--card-line); color: var(--ink); border-bottom-left-radius: 3px; }
  .chat-google-btn{
    display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 700;
    color: var(--turf-strong); text-decoration: none; border: 1px solid var(--card-line);
    border-radius: 20px; padding: 5px 11px;
  }
  .chat-google-btn:hover{ border-color: var(--turf); }
  .chat-suggestions{ display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chat-chip{
    appearance: none; border: 1px solid var(--card-line); background: var(--paper); color: var(--ink-soft);
    border-radius: 20px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .chat-chip:hover{ border-color: var(--turf); color: var(--ink); }
  .chat-input-row{ display: flex; gap: 8px; margin-top: 12px; }
  .chat-input-row input{
    flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    border-radius: 20px; padding: 10px 16px; font-size: 14px;
  }
  .chat-input-row input:focus{ border-color: var(--turf); }
  .chat-send-btn{
    appearance: none; border: none; cursor: pointer; flex-shrink: 0;
    width: 40px; height: 40px; border-radius: 50%; background: var(--turf); color: #fff; font-size: 16px;
  }
  .chat-send-btn:hover{ filter: brightness(1.06); }
  .hero-icon{ border-radius: 50%; box-shadow: 0 12px 28px rgba(30,15,0,0.4); margin-bottom: 16px; background:#fff; }
  .hero-title{ font-size: 27px; font-weight: 800; letter-spacing: -0.01em; text-shadow: 0 1px 3px rgba(0,0,0,0.3); }
  .hero-tag{
    font-size: 13.5px; color: rgba(255,255,255,0.9); margin: 6px auto 0;
    max-width: 28ch; line-height: 1.5;
  }
  .pitch-list{ display: flex; flex-direction: column; gap: 13px; margin-bottom: 6px; }
  .pitch-item{ display: flex; align-items: flex-start; gap: 12px; font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; }
  .pitch-ico{ font-size: 18px; flex-shrink: 0; line-height: 1.3; }
  .paused-note{
    background: var(--bail-tint); color: var(--bail); border-radius: 8px;
    padding: 10px 14px; font-size: 13px; font-weight: 700; text-align: center;
  }

  main{ flex:1; padding:18px; display:flex; flex-direction:column; gap:16px; }

  .eyebrow{
    font-size:11px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--turf-strong); margin:0 0 6px;
  }
  h1{
    font-size:26px; margin:0 0 4px; text-wrap:balance; letter-spacing:-0.01em;
  }
  .lede{ color:var(--ink-soft); font-size:14.5px; line-height:1.5; margin:0 0 18px; max-width:34ch; }

  .card{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:10px;
    padding:18px;
  }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .field label{ font-size:11.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-soft); }
  .field input{
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    border-radius:7px;
    padding:11px 12px;
    font-size:16px;
    width:100%;
  }
  .field input:focus{ border-color:var(--turf); }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; min-width:0; }

  .btn{
    appearance:none; border:none; cursor:pointer;
    border-radius:8px;
    font-weight:700;
    font-size:15px;
    padding:13px 16px;
    transition:transform .08s ease, filter .15s ease;
  }
  @media (prefers-reduced-motion: reduce){ .btn{ transition:none; } }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--turf); color:#fff; width:100%; }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{
    background:transparent; color:var(--ink-soft); border:1px solid var(--line);
    font-size:12.5px; font-weight:700; letter-spacing:0.02em; padding:9px 12px;
  }
  .btn-ghost:hover{ border-color:var(--ink-soft); color:var(--ink); }
  .btn-export{
    background:var(--bail-tint); color:var(--bail); border:1.5px solid var(--bail);
    width:100%;
  }
  .btn-export:hover{ filter:brightness(0.96); }
  .btn-choice{
    background:var(--card); color:var(--ink); border:1.5px solid var(--card-line);
    width:100%; text-align:left; padding:16px; font-size:16px; font-weight:700;
    display:flex; justify-content:space-between; align-items:center;
  }
  .btn-choice:hover{ border-color:var(--turf); }
  .btn-choice .arrow{ color:var(--turf); font-weight:400; }

  .error-text{ color:var(--ball); font-size:13px; font-weight:600; margin:-6px 0 12px; }

  .scoreboard{
    background:var(--card); border:1px solid var(--card-line); border-radius:12px;
    padding:20px 20px 16px;
  }
  .sb-batting{ font-size:12px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; }
  .sb-main{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .sb-score{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:44px; font-weight:700; letter-spacing:-0.01em; }
  .sb-overs{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:16px; color:var(--ink-soft); }

    extras:{ wide:0, noBall:0, bye:0, legBye:0 },

function migrateBatsman(b){
  if(!b) return b;
  ["ones","twos","threes","fours","sixes"].forEach(k=>{ if(typeof b[k]!=="number") b[k]=0; });

function migrateState(s){
  if(!s) return s;
  if(!s.extrasEnabled) s.extrasEnabled = { ...ALL_EXTRAS_ON };
  if(s.theme!=="light" && s.theme!=="dark" && s.theme!=="system") s.theme = "system";

  s.innings.forEach(inning=>{
    if(!inning) return;
    if(inning.batsmen){ migrateBatsman(inning.batsmen.A); migrateBatsman(inning.batsmen.B); }
    if(!inning.retired) inning.retired = [];
    if(!inning.fallOfWickets) inning.fallOfWickets = [];
    if(!inning.thisOverBalls) inning.thisOverBalls = [];
    if(!inning.overHistory) inning.overHistory = [];

    if(typeof inning.soloMode !== "boolean") inning.soloMode = false;

      byName[p.name] = { name:p.name, runs:0, balls:0, fours:0, sixes:0, ones:0, twos:0, threes:0, refs:[], stints:[] };
      order.push(p.name);
    }
    const g = byName[p.name];
    g.runs += p.runs; g.balls += p.balls;
    g.fours += (p.fours||0); g.sixes += (p.sixes||0);
    g.ones += (p.ones||0); g.twos += (p.twos||0); g.threes += (p.threes||0);
    const ref = p.out ? {type:"fow", idx:p.fowIndex} : p.retired ? {type:"retired", idx:p.retiredIndex} : {type:"live", key:p.liveKey};
    g.refs.push(ref);
    g.stints.push(p);
  });
  return order.map(name=>{
    const g = byName[name];
    const live = g.stints.find(s=>!s.out && !s.retired);
    const lastDismissal = g.stints.slice().reverse().find(s=>s.out);
    const rep = live || lastDismissal || g.stints[g.stints.length-1];
    return {
      name:g.name, runs:g.runs, balls:g.balls, fours:g.fours, sixes:g.sixes,
      out:rep.out, retired:rep.retired, dismissalType:rep.dismissalType,
      bowler:rep.bowler, fielder:rep.fielder, refs:g.refs
    };
  });
}
function allPlayers(s){
  s = s || state;
  const map = {};
  function ensure(name, teamKey){
    if(!map[name]) map[name] = { name, teamKey, runs:0, balls:0, fours:0, sixes:0, wickets:0, ballsBowled:0, runsConceded:0 };
    return map[name];
  }
  s.innings.forEach(inning=>{
    if(!inning) return;
    battingList(inning).forEach(p=>{
      const e = ensure(p.name, inning.battingKey);
      e.runs += p.runs; e.balls += p.balls; e.fours += (p.fours||0); e.sixes += (p.sixes||0);
    });
    Object.entries(inning.bowlers).filter(([,f])=>f.balls>0).forEach(([name,f])=>{
      const e = ensure(name, inning.bowlingKey);
      e.wickets += f.wickets; e.ballsBowled += f.balls; e.runsConceded += f.runs;
    });
  });
  return Object.values(map);
}
function momScore(p){ return p.runs + p.fours*1 + p.sixes*2 + p.wickets*20; }
function momSummary(p){

  if(p.ballsBowled>0) parts.push(`${p.wickets}/${p.runsConceded}`);
  return parts.join(" & ") || "—";
}

function archiveMatch(){

function strikeRate(p){
  return p.balls>0 ? (p.runs/p.balls*100).toFixed(2) : "0.00";
}
function dismissalText(p){
  if(p.retired) return "retired hurt";
  if(!p.out) return "not out";
  const bowler = esc(p.bowler || "?");
  const fielder = p.fielder ? esc(p.fielder) : null;
  switch(p.dismissalType){
    case "bowled": return `b ${bowler}`;
    case "caught": return fielder ? `c ${fielder} b ${bowler}` : `c &amp; b ${bowler}`;
    case "lbw": return `lbw b ${bowler}`;
    case "stumped": return fielder ? `st ${fielder} b ${bowler}` : `st b ${bowler}`;
    case "hitwicket": return `hit wicket b ${bowler}`;
    case "runout": return fielder ? `run out (${fielder})` : "run out";
    default: return `out &middot; ${bowler}`;
  }
}

function detectLiveEvents(prev, next){
  const events = { boundary: null, wicket: false };
  if(!prev || !next) return events;
  if(prev.inningsIndex !== next.inningsIndex) return events;
  const prevInning = prev.innings[prev.inningsIndex], nextInning = next.innings[next.inningsIndex];
  if(!prevInning || !nextInning) return events;
  const runDelta = nextInning.runs - prevInning.runs;
  const ballDelta = nextInning.legalBalls - prevInning.legalBalls;
  const wicketDelta = nextInning.wickets - prevInning.wickets;
  if(ballDelta===1 && wicketDelta===0 && (runDelta===4 || runDelta===6)) events.boundary = runDelta;
  if(wicketDelta===1) events.wicket = true;
  return events;
}
let liveViewerPrevState = null;
let liveViewerLastPayload = null;

function startLiveViewer(matchId){
  applyTheme();
  liveViewerScorecardTab = "scorecard";
  document.documentElement.setAttribute("data-app-screen", "live");
  renderLiveViewer(matchId, null, "loading");
  getFirebaseApp();
  firebase.database().ref("matches/"+matchId).on("value",
    snap => {
      const val = snap.val();
      if(val && val.state) val.state = migrateState(val.state);
      if(val && val.state){
        const events = detectLiveEvents(liveViewerPrevState, val.state);
        if(events.boundary) showBoundaryPopup(events.boundary);
        if(events.wicket) showWicketPopup();
        liveViewerPrevState = val.state;
      }
      liveViewerLastPayload = val;
      renderLiveViewer(matchId, val, val ? "ok" : "notfound");
      if(val && val.state && val.state.screen==="result" && matchId!==lastLiveFireworksMatchId){
        lastLiveFireworksMatchId = matchId;
        if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
          requestAnimationFrame(playFireworks);
        }
      }
    },
    () => renderLiveViewer(matchId, null, "error")

}

let lastFireworksMatchId = null;

const BACK_STACK_SCREENS = new Set(["welcome","menu","info","chat","history","history-detail"]);
function render(){
  const screenChanged = !lastRenderedSnapshot || lastRenderedSnapshot.screen !== state.screen;
  const safeForBackStack = screenChanged && lastRenderedSnapshot
    && BACK_STACK_SCREENS.has(lastRenderedSnapshot.screen) && BACK_STACK_SCREENS.has(state.screen);
  if(!suppressNavPush && safeForBackStack){
    navStack.push(lastRenderedSnapshot);
    history.pushState({navDepth: navStack.length}, "", location.href);
  }
  suppressNavPush = false;
  lastRenderedSnapshot = JSON.parse(JSON.stringify(state));

  document.documentElement.setAttribute("data-app-screen", state.screen);
  applyTheme();
  document.getElementById("app").innerHTML = screenHtml();
  if(screenChanged) window.scrollTo(0, 0);
  if(state.screen==="result" && state.matchId && state.matchId!==lastFireworksMatchId){
    lastFireworksMatchId = state.matchId;
    if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
      requestAnimationFrame(playFireworks);
    }
  }
}
window.addEventListener("popstate", () => {

    suppressNavPush = true;
    state = prev;
    save();
    render();
  }
});
let fireworksAudioCtx = null;
function getFireworksAudioCtx(){
  if(!fireworksAudioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    fireworksAudioCtx = new AC();
  }
  if(fireworksAudioCtx.state === "suspended"){
    fireworksAudioCtx.resume().catch(()=>{});
  }
  return fireworksAudioCtx;
}
function playCoinFlipSound(){
  const ac = getFireworksAudioCtx();
  if(!ac) return;
  const now = ac.currentTime;
  const duration = 1.0;
  const clickCount = 10;
  for(let i=0; i<clickCount; i++){
    // clicks bunch up early and space out later, mimicking a spinning coin slowing down
    const t = now + duration * Math.pow(i/clickCount, 1.6);
    const bufferSize = Math.max(1, Math.floor(ac.sampleRate * 0.012));
    const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
    const data = buffer.getChannelData(0);
    for(let j=0; j<bufferSize; j++){ data[j] = (Math.random()*2-1) * (1 - j/bufferSize); }
    const noise = ac.createBufferSource();
    noise.buffer = buffer;
    const filter = ac.createBiquadFilter();
    filter.type = "highpass";
    filter.frequency.value = 3000;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.02);
    noise.connect(filter).connect(g).connect(ac.destination);
    noise.start(t);
  }
  const landT = now + duration;
  const osc = ac.createOscillator();
  osc.type = "triangle";
  osc.frequency.setValueAtTime(1200, landT);
  osc.frequency.exponentialRampToValueAtTime(500, landT+0.15);
  const gain = ac.createGain();
  gain.gain.setValueAtTime(0.25, landT);
  gain.gain.exponentialRampToValueAtTime(0.001, landT+0.2);
  osc.connect(gain).connect(ac.destination);
  osc.start(landT);
  osc.stop(landT+0.2);
}
let tossCoinRotation = 0;
let tossCoinShowingHeads = true;
function flipCoin(){
  const coin = document.getElementById("tossCoinInner");
  if(!coin || coin.dataset.flipping==="1") return;
  const resultEl = document.getElementById("tossCoinResult");
  coin.dataset.flipping = "1";
  if(resultEl) resultEl.textContent = "Flipping…";
  const isHeads = Math.random() < 0.5;
  playCoinFlipSound();
  const spins = 5 + Math.floor(Math.random()*3);
  const faceChange = (isHeads !== tossCoinShowingHeads) ? 180 : 0;
  tossCoinRotation += spins*360 + faceChange;
  tossCoinShowingHeads = isHeads;
  coin.style.transform = `rotateY(${tossCoinRotation}deg)`;
  setTimeout(()=>{
    coin.dataset.flipping = "0";
    if(resultEl) resultEl.textContent = isHeads ? "Heads!" : "Tails!";
  }, 1000);
}
function playCrackleSound(){
  const ac = getFireworksAudioCtx();
  if(!ac) return;
  const now = ac.currentTime;

  const osc = ac.createOscillator();
  osc.type = "sine";
  osc.frequency.setValueAtTime(160, now);
  osc.frequency.exponentialRampToValueAtTime(50, now + 0.22);
  const boomGain = ac.createGain();
  boomGain.gain.setValueAtTime(0.4, now);
  boomGain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
  osc.connect(boomGain).connect(ac.destination);
  osc.start(now);
  osc.stop(now + 0.3);

  const crackleCount = 5 + Math.floor(Math.random()*4);
  for(let i=0; i<crackleCount; i++){
    const t = now + 0.03 + Math.random()*0.28;
    const dur = 0.02 + Math.random()*0.02;
    const bufferSize = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
    const data = buffer.getChannelData(0);
    for(let j=0; j<bufferSize; j++){ data[j] = (Math.random()*2-1) * (1 - j/bufferSize); }
    const noise = ac.createBufferSource();
    noise.buffer = buffer;
    const filter = ac.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 1200 + Math.random()*2600;
    filter.Q.value = 0.8;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.22 + Math.random()*0.1, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    noise.connect(filter).connect(g).connect(ac.destination);
    noise.start(t);
  }
}
function playFireworks(){
  const canvas = document.getElementById("fireworksCanvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;

  const COLORS = ["#2f6b4f", "#5aab7c", "#b23a2e", "#dba53f", "#f6f3ea"];
  let particles = [];
  function burst(x, y){
    playCrackleSound();
    const count = 34;
    for(let i=0; i<count; i++){
      const angle = (Math.PI*2*i)/count + Math.random()*0.3;
      const speed = (2 + Math.random()*3) * dpr;
      particles.push({
        x, y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        color: COLORS[Math.floor(Math.random()*COLORS.length)],
        alpha: 1,
        size: (2 + Math.random()*2) * dpr
      });
    }
  }

  const burstCount = 6;
  const bursts = [];
  for(let i=0; i<burstCount; i++){
    bursts.push({
      time: i * 380,
      x: (0.2 + Math.random()*0.6) * canvas.width,
      y: (0.16 + Math.random()*0.28) * canvas.height
    });
  }

  const start = performance.now();
  let bIdx = 0;
  function frame(now){
    if(!document.getElementById("fireworksCanvas")) return;
    const elapsed = now - start;
    while(bIdx < bursts.length && elapsed >= bursts[bIdx].time){
      burst(bursts[bIdx].x, bursts[bIdx].y);
      bIdx++;
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p=>{
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05 * dpr;
      p.alpha -= 0.012;
    });
    particles = particles.filter(p=>p.alpha>0);
    particles.forEach(p=>{
      ctx.globalAlpha = Math.max(p.alpha, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    if(elapsed < 3600 || particles.length>0){
      requestAnimationFrame(frame);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  requestAnimationFrame(frame);
}

      <p><b>The basics</b></p>
      <p>Two teams take turns batting and bowling. The batting side tries to score as many runs as possible; the bowling side tries to dismiss batsmen and limit runs. Whichever side scores more runs when the match ends wins.</p>
      <p><b>Teams &amp; innings</b></p>
      <p>A full side has 11 players (gully cricket is often played with fewer). In limited-overs cricket, each innings is a fixed number of overs; in Test cricket, innings are unlimited by overs. Two batsmen are always at the crease together, while the bowling side sends down one bowler at a time, bowling six legal deliveries — an over — before a different bowler takes over from the other end.</p>
      <p><b>Scoring runs</b></p>
      <p>Batsmen score by running between the two wickets after hitting the ball, or automatically via a boundary: <b>4 runs</b> if the ball reaches the boundary after touching the ground, <b>6 runs</b> if it clears the boundary without bouncing.</p>

  const theme = state.theme || "system";
  if(theme==="system"){

const CRICKET_FAQ = [
  { kw: ["lbw", "leg before wicket"], a: "LBW (leg before wicket): the batsman is out if the ball would have hit the stumps, but struck their leg or body first instead of the bat — provided it didn't pitch outside leg stump and a few other conditions the umpire judges." },
  { kw: ["how many players", "team size", "players in a team", "players in cricket"], a: "A full cricket side has 11 players. Gully/street cricket is often played with fewer, by informal agreement." },
  { kw: ["wide", "what is a wide"], a: "A wide is a delivery bowled too far from the batsman for them to reasonably play a shot at it. It adds 1 run to the batting team and doesn't count as a legal ball." },
  { kw: ["no ball", "noball", "no-ball"], a: "A no-ball is an illegal delivery — most commonly the bowler overstepping the crease. It adds 1 run and doesn't count as a legal ball; in some formats the batsman also gets a free hit on the next delivery." },
  { kw: ["bye", "leg bye"], a: "A bye is a run scored when the ball passes the batsman untouched (usually past the keeper). A leg bye is when it deflects off the batsman's body, not the bat. Both add runs to the team total, not to the batsman personally." },
  { kw: ["boundary", "four", "six", "runs for a"], a: "A boundary hit that touches the ground before crossing the rope scores 4 runs. If it clears the boundary without bouncing, it's 6 runs." },
  { kw: ["over", "balls in an over", "how many balls"], a: "An over is 6 legal deliveries bowled by one bowler from one end. A different bowler then takes over from the other end for the next over." },
  { kw: ["overs in a t20", "overs in t20", "how many overs in a t20", "t20 overs"], a: "A T20 match is 20 overs per side." },
  { kw: ["overs in an odi", "overs in odi", "how many overs in an odi", "odi overs"], a: "An ODI (One Day International) match is 50 overs per side." },
  { kw: ["overs in a test", "overs in test match", "how many overs in a test"], a: "Test cricket has no fixed number of overs — each innings is limited only by wickets and the 5 days available, not an overs count." },
  { kw: ["out", "dismissed", "dismissal", "ways to get out"], a: "The main ways to get out: bowled, caught, run out, stumped, LBW, and hit wicket. There are a few rarer dismissals too, like obstructing the field." },
  { kw: ["duck"], a: "A \"duck\" means a batsman got out for 0 runs. A \"golden duck\" is getting out on the very first ball you face." },
  { kw: ["maiden"], a: "A maiden over is one in which the bowler concedes zero runs (no runs off the bat, and no extras) across all 6 legal deliveries." },
  { kw: ["hat-trick", "hat trick"], a: "A hat-trick is when a bowler takes 3 wickets on 3 consecutive deliveries — they don't have to be in the same over." },
  { kw: ["difference between test", "odi", "t20", "formats of cricket"], a: "Test cricket is played over up to 5 days with unlimited overs per innings. ODIs (One Day Internationals) are limited to 50 overs a side. T20 is the shortest, at 20 overs a side." },
  { kw: ["declaration", "declare"], a: "A declaration (Test cricket only) is when the batting captain voluntarily ends their own innings before being all out or running out of overs, usually to leave more time to bowl the opposition out." },
  { kw: ["follow-on", "follow on"], a: "The follow-on (Test cricket) lets the team that batted first force the other side to bat again immediately, if that side trailed by a large enough margin in the first innings." },
  { kw: ["drs", "review"], a: "DRS (Decision Review System) lets players challenge an umpire's on-field decision, using replays and ball-tracking technology to confirm or overturn it." },
  { kw: ["powerplay", "power play"], a: "A powerplay is a set of overs (mainly in ODIs/T20s) with fielding restrictions — fewer fielders are allowed outside a marked inner circle, favouring the batting side." },
  { kw: ["yorker", "googly", "bouncer", "bowling terms"], a: "A yorker is bowled to land right at the batsman's feet. A googly is a leg-spinner's delivery that spins the opposite way to what it looks like. A bouncer is bowled short, rising toward the batsman's upper body/head." },
  { kw: ["tied", "tie", "scores level"], a: "If both teams finish with the exact same score, the match is a tie. Some limited-overs tournaments use a Super Over or bowl-out to break a tie in the knockout stage — but a tie is a valid, final result on its own in most matches." },
  { kw: ["strike rate"], a: "Batting strike rate is runs scored per 100 balls faced (runs ÷ balls × 100). Bowling economy rate is runs conceded per over bowled." },
  { kw: ["captain", "toss"], a: "Before a match, the two captains toss a coin; the winner chooses whether to bat or field first." }
];
function matchFaq(question){
  const q = question.toLowerCase();
  let best = null, bestScore = 0;
  CRICKET_FAQ.forEach(item=>{
    let score = 0;
    item.kw.forEach(k=>{ if(q.includes(k)) score += k.split(" ").length; });
    if(score > bestScore){ bestScore = score; best = item; }
  });
  return best;
}
let chatMessages = [];
function goToChat(){
  state._chatReturnScreen = state.screen;
  state.screen = "chat";
  save(); render();
  scrollChatToBottom();
}
function closeChat(){
  state.screen = state._chatReturnScreen || "welcome";
  save(); render();
}
function scrollChatToBottom(){
  const el = document.getElementById("chatMessages");
  if(el) el.scrollTop = el.scrollHeight;
}
function askChat(text){
  text = (text || "").trim();
  if(!text) return;
  chatMessages.push({ from:"user", text });
  const match = matchFaq(text);
  if(match){
    chatMessages.push({ from:"bot", text: match.a });
  } else {
    chatMessages.push({ from:"bot", text: "I don't have that one built in yet — try rephrasing, or search it directly.", googleQuery: text });
  }
  render();
  scrollChatToBottom();
}
function sendChatMessage(){
  const input = document.getElementById("chatInput");
  if(!input) return;
  const text = input.value;
  input.value = "";
  askChat(text);
}
function chatInputKeydown(e){
  if(e.key === "Enter"){ e.preventDefault(); sendChatMessage(); }
}

function entryFormHtml(inning){
  const { needA, needB, needBowler } = neededSlots(inning);

  let title, hint;
  if(isInningsStart){
    title = "Send the openers in";
    hint = "Enter the two openers and the first bowler to start this innings.";
  } else if(inning.soloMode){
    title = needBowler && needNewBatsman ? "Last man batting &amp; new over" : needNewBatsman ? "Last man batting" : "Over complete — who's bowling next?";
    hint = needNewBatsman ? "No partner is available — enter the last man's name and they'll bat alone until they're out or overs run out." : "Enter the name of the bowler for this end.";
  } else if(needNewBatsman && needBowler){
    title = "New batsman &amp; new over";

        ${state.inningsIndex===0
          ? `<button class="innings-pill" onclick="editOvers()" title="Change overs">${state.oversLimit} OV · INNINGS 1 OF 2 ✎</button>`
          : `<div class="innings-pill locked" title="Overs are locked once the 2nd innings starts">${state.oversLimit} OV · INNINGS 2 OF 2 🔒</div>`}
        <button class="icon-btn" onclick="shareTransferLink()" title="Continue on another device" aria-label="Continue on another device">🔗</button>
        <button class="icon-btn ${state.liveSharing ? 'live-active' : ''}" onclick="shareLiveScore()" title="${state.liveSharing ? 'Sharing live -- tap to stop' : 'Share live score with spectators'}" aria-label="${state.liveSharing ? 'Stop live sharing' : 'Share live score'}">${state.liveSharing ? '🔴' : '📡'}</button>
      </div>
    </div>
    <main>
      <div class="scoreboard">
        <div class="sb-batting">${esc(battingName)} batting · ${esc(bowlingName)} bowling</div>
        <div class="sb-main">
          <div class="sb-score">${inning.runs}/${inning.wickets}</div>
          <div class="sb-overs">${oversText(inning.legalBalls)} / ${state.oversLimit} ov · CRR ${crr} · ${inning.soloMode ? "last man batting" : "all out at 10"}</div>
        </div>
        ${subLine}
      </div>
      ${pending ? entryFormHtml(inning) : `${crewHtml}${bowlerHtml}${overStrip}${state.wicketMenuOpen ? wicketMenuHtml : state.retireMenuOpen ? retireMenuHtml : padHtml}`}
    </main>
  `;
}

function breakScreen(){
  const inning = state.innings[0];
  const target = inning.runs+1;
  return `
    <main>
      <div class="eyebrow">Innings break</div>
      <h1>${esc(teamName(inning.battingKey))} made ${inning.runs}/${inning.wickets}</h1>
      <p class="lede">${esc(teamName(inning.bowlingKey))} need <b>${target}</b> to win off ${state.oversLimit} over${state.oversLimit===1?"":"s"}.</p>
      ${scorecardTabsHtml(scorecardTab, "setScorecardTab")}
      <div class="card tab-pane ${scorecardTab==="scorecard"?"active":""}">${scorecardHtml(inning, "Innings 1", 0, state.extrasEnabled)}</div>
      <div class="card tab-pane ${scorecardTab==="overs"?"active":""}">${overSummaryHtml(inning, "Innings 1")}</div>
      <button class="btn btn-primary" onclick="startInnings2()">Start innings 2</button>
      <button class="btn-ghost" style="width:100%; padding:11px 12px;" onclick="editOvers()">✎ Change overs (currently ${state.oversLimit})</button>
      <button class="btn-ghost" style="width:100%; padding:11px 12px;" onclick="shareTransferLink()">🔗 Continue on another device</button>
      <button class="btn-ghost" style="width:100%; padding:11px 12px;" onclick="shareLiveScore()">${state.liveSharing ? '🔴 Sharing live -- tap to stop' : '📡 Share live score'}</button>
      <button class="btn-ghost" style="width:100%; padding:11px 12px;" onclick="goHome()">🏠 Home</button>
    </main>
    <footer>You'll enter the new openers and the opening bowler next.</footer>
  `;
}

function resultScreen(){
  const i1 = state.innings[0], i2 = state.innings[1];
  const { text, tied } = matchResult(state);

  const players = allPlayers().sort((a,b)=>momScore(b)-momScore(a));
  const suggested = players[0];
  const momName = state.manOfMatch || (suggested ? suggested.name : null);
  const momPlayer = players.find(p=>p.name===momName);
  const momCard = momPlayer ? `
    <div class="card mom-card">
      <div class="mom-eyebrow">🏅 Man of the match</div>
      <div class="mom-body">
        <div>
          <div class="mom-name">${esc(momPlayer.name)}</div>
          <div class="mom-figs">${esc(momSummary(momPlayer))} · ${esc(teamName(momPlayer.teamKey))}</div>
        </div>
        <select class="mom-select no-print" onchange="chooseManOfMatch(this.value)" aria-label="Change man of the match">
          ${players.map(p=>`<option value="${esc(p.name)}" ${p.name===momPlayer.name?"selected":""}>${esc(p.name)}</option>`).join("")}
        </select>
      </div>
    </div>
  ` : "";

  const printHeader = `
    <div class="print-only sc-print-header">
      <div class="sc-print-title">${esc(state.teamAName)} vs ${esc(state.teamBName)}</div>
      <div class="sc-print-meta">${state.oversLimit}-over match &middot; ${esc(new Date().toLocaleDateString())}</div>
      <div class="sc-print-brand">Cric Score</div>
    </div>
  `;

  const feedbackCard = shouldShowFeedbackPrompt() ? `
    <div class="card feedback-card no-print">
      <div class="feedback-title">Enjoying Cric Score?</div>
      <div class="feedback-hint">Tap a star to rate it.</div>
      <div class="star-row">
        ${[1,2,3,4,5].map(n=>`<button class="star-btn" onclick="rateApp(${n})" aria-label="${n} star${n>1?"s":""}">&#9733;</button>`).join("")}
      </div>
      <button class="feedback-dismiss" onclick="dismissFeedbackForever()">Don't ask again</button>
    </div>
  ` : "";

  return `
    <canvas id="fireworksCanvas" class="fireworks-canvas no-print"></canvas>
    <main>
      ${printHeader}
      <div class="result-banner">
        <div class="rb-trophy">${tied ? "🤝" : "🏆"}</div>
        <div class="rb-eyebrow">Full time</div>
        <div class="rb-text">${esc(text)}</div>
      </div>
      <div class="card">
        <div style="font-weight:700; margin-bottom:10px">${esc(teamName(i1.battingKey))} ${i1.runs}/${i1.wickets} <span style="color:var(--ink-soft); font-weight:400">(${oversText(i1.legalBalls)} ov)</span> &nbsp;·&nbsp; ${esc(teamName(i2.battingKey))} ${i2.runs}/${i2.wickets} <span style="color:var(--ink-soft); font-weight:400">(${oversText(i2.legalBalls)} ov)</span></div>
      </div>
      ${momCard}
      ${scorecardTabsHtml(scorecardTab, "setScorecardTab")}
      <div class="tab-pane ${scorecardTab==="scorecard"?"active":""}">
        <div class="card">${scorecardHtml(i1, "Innings 1", null, state.extrasEnabled)}</div>
        <div class="card">${scorecardHtml(i2, "Innings 2", null, state.extrasEnabled)}</div>
      </div>
      <div class="tab-pane ${scorecardTab==="overs"?"active":""}">
        <div class="card">${overSummaryHtml(i1, "Innings 1")}</div>
        <div class="card">${overSummaryHtml(i2, "Innings 2")}</div>
      </div>
      ${feedbackCard}
      <div class="no-print" style="display:flex; flex-direction:column; gap:8px;">
        <button class="btn btn-export" onclick="exportScorecard()">⬇ Export PDF</button>
        <button class="btn-ghost" style="width:100%; padding:11px 12px;" onclick="shareLiveScore()">${state.liveSharing ? '🔴 Sharing live -- tap to stop' : '📡 Share live score'}</button>
        <button class="btn btn-primary" onclick="newMatch()">New match</button>
        <button class="btn-ghost" style="width:100%; padding:11px 12px;" onclick="openHistory()">📜 View all past matches</button>
      </div>
      ${copyrightLine()}
    </main>
    <footer class="no-print">This match is saved to your match history. Export PDF opens your browser's print dialog — choose "Save as PDF" as the destination.</footer>
  `;
}

function historyScreen(){
  const history = loadHistory();
  const cards = history.map(h=>`
    <div class="card history-card">
      <div class="history-top">
        <div class="history-teams">${esc(h.teamA)} vs ${esc(h.teamB)}</div>
        <div class="history-date">${h.date ? esc(new Date(h.date).toLocaleDateString()) : ""}</div>
      </div>
      <div class="history-score">${h.i1.runs}/${h.i1.wickets} (${h.i1.overs}) &nbsp;·&nbsp; ${h.i2.runs}/${h.i2.wickets} (${h.i2.overs})</div>
      <div class="history-result">${esc(h.resultText)}</div>
      ${h.manOfMatch ? `<div class="history-mom">🏅 ${esc(h.manOfMatch)}</div>` : ""}
      <div class="util-row">
        <button class="btn-ghost" onclick="viewHistoryDetail('${h.id}')">View scorecard</button>
        <button class="btn-ghost" onclick="deleteHistoryEntry('${h.id}')">Delete</button>
      </div>
    </div>
  `).join("");
  return `
    <main>
      <div class="eyebrow">Match history</div>
      <h1>Past matches</h1>
      ${history.length ? cards : '<p class="lede">No finished matches yet — they will show up here once you complete one.</p>'}
      <button class="btn-ghost" style="width:100%; padding:11px 12px;" onclick="closeHistory()">← Back</button>
    </main>
    <footer>Stored on this device only.</footer>
  `;
}

function historyDetailScreen(){
  const entry = loadHistory().find(h=>h.id===state.viewingHistoryId);
  if(!entry) return historyScreen();
  const s = entry.fullState;
  const i1 = s.innings[0], i2 = s.innings[1];
  const printHeader = `
    <div class="print-only sc-print-header">
      <div class="sc-print-title">${esc(entry.teamA)} vs ${esc(entry.teamB)}</div>
      <div class="sc-print-meta">${entry.oversLimit}-over match${entry.date ? " &middot; "+esc(new Date(entry.date).toLocaleDateString()) : ""}</div>
      <div class="sc-print-brand">Cric Score</div>
    </div>
  `;
  return `
    <main>
      ${printHeader}
      <div class="eyebrow no-print">Match history</div>
      <h1 class="no-print">${esc(entry.teamA)} vs ${esc(entry.teamB)}</h1>
      <p class="lede no-print">${entry.date ? esc(new Date(entry.date).toLocaleDateString())+" · " : ""}${esc(entry.resultText)}</p>
      ${entry.manOfMatch ? `<div class="card mom-card"><div class="mom-eyebrow">🏅 Man of the match</div><div class="mom-name">${esc(entry.manOfMatch)}</div></div>` : ""}
      ${scorecardTabsHtml(scorecardTab, "setScorecardTab")}
      <div class="tab-pane ${scorecardTab==="scorecard"?"active":""}">
        <div class="card">${scorecardHtml(i1, "Innings 1", null, s.extrasEnabled)}</div>
        <div class="card">${scorecardHtml(i2, "Innings 2", null, s.extrasEnabled)}</div>
      </div>
      <div class="tab-pane ${scorecardTab==="overs"?"active":""}">
        <div class="card">${overSummaryHtml(i1, "Innings 1")}</div>
        <div class="card">${overSummaryHtml(i2, "Innings 2")}</div>
      </div>
      <div class="no-print" style="display:flex; flex-direction:column; gap:8px;">
        <button class="btn btn-export" onclick="exportScorecard()">⬇ Export PDF</button>
        <button class="btn-ghost" style="width:100%; padding:11px 12px;" onclick="backToHistoryList()">← Back to history</button>
      </div>
      ${copyrightLine()}
    </main>
    <footer class="no-print">Read-only — this match has already finished.</footer>
  `;
}

function playBootAnimation(cb){
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduceMotion){ cb(); return; }
  let done = false;
  const finish = () => {
    if(done) return;
    done = true;
    cb();
  };
  const el = document.getElementById("bootSplash");
  if(el) el.addEventListener("click", finish, { once: true });
  setTimeout(finish, 1500);
}
playBootAnimation(liveViewMatchId ? (() => startLiveViewer(liveViewMatchId)) : render);

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
