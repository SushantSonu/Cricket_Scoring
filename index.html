<style>
  :root{
    --ink:#1c2521;
    --ink-soft:#5b655e;
    --paper:#f6f3ea;
    --card:#ffffff;
    --card-line:#e4ddc9;
    --line:#ddd5c0;
    --turf:#2f6b4f;
    --turf-strong:#1f4d38;
    --turf-tint:#e7f0e8;
    --ball:#b23a2e;
    --ball-tint:#f8e6e2;
    --bail:#a9701c;
    --bail-tint:#f5ead4;
    --info-blue:#2f5f8a;
    --info-blue-tint:#e7eef5;
    --info-purple:#6b4a94;
    --info-purple-tint:#efe7f5;
    --info-teal:#1f7a6c;
    --info-teal-tint:#e2f2ee;
    --chip-glass:rgba(255,255,255,0.55);
    --shadow:rgba(28,37,33,0.10);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#eef0e8;
      --ink-soft:#a6b0a8;
      --paper:#10140f;
      --card:#171d17;
      --card-line:#293025;
      --line:#2a3226;
      --turf:#5aab7c;
      --turf-strong:#7fcb9d;
      --turf-tint:#1a2b21;
      --ball:#e2685a;
      --ball-tint:#2e1c19;
      --bail:#dba53f;
      --bail-tint:#2c2313;
      --info-blue:#7bb0e8;
      --info-blue-tint:#182533;
      --info-purple:#bd9bde;
      --info-purple-tint:#241c2c;
      --info-teal:#5fd0b8;
      --info-teal-tint:#132821;
      --chip-glass:rgba(0,0,0,0.28);
      --shadow:rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --ink:#eef0e8; --ink-soft:#a6b0a8; --paper:#10140f; --card:#171d17; --card-line:#293025;
    --line:#2a3226; --turf:#5aab7c; --turf-strong:#7fcb9d; --turf-tint:#1a2b21;
    --ball:#e2685a; --ball-tint:#2e1c19; --bail:#dba53f; --bail-tint:#2c2313; --shadow:rgba(0,0,0,0.45);
    --info-blue:#7bb0e8; --info-blue-tint:#182533; --info-purple:#bd9bde; --info-purple-tint:#241c2c;
    --info-teal:#5fd0b8; --info-teal-tint:#132821; --chip-glass:rgba(0,0,0,0.28);
  }
  :root[data-theme="light"]{
    --ink:#1c2521; --ink-soft:#5b655e; --paper:#f6f3ea; --card:#ffffff; --card-line:#e4ddc9;
    --line:#ddd5c0; --turf:#2f6b4f; --turf-strong:#1f4d38; --turf-tint:#e7f0e8;
    --ball:#b23a2e; --ball-tint:#f8e6e2; --bail:#a9701c; --bail-tint:#f5ead4; --shadow:rgba(28,37,33,0.10);
    --info-blue:#2f5f8a; --info-blue-tint:#e7eef5; --info-purple:#6b4a94; --info-purple-tint:#efe7f5;
    --info-teal:#1f7a6c; --info-teal-tint:#e2f2ee; --chip-glass:rgba(255,255,255,0.55);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:
      repeating-linear-gradient(to bottom, transparent 0 39px, var(--line) 39px 40px),
      var(--paper);
    color:var(--ink);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
  }
  .shell{
    position:relative;
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    box-shadow:0 0 40px var(--shadow);
  }
  button{ font-family:inherit; -webkit-tap-highlight-color:transparent; }
  input{ font-family:inherit; }
  button:focus-visible, input:focus-visible, a:focus-visible{
    outline:2px solid var(--turf);
    outline-offset:2px;
  }
  .topbar{
    position:sticky; top:0; z-index:5;
    background:var(--paper);
    border-bottom:1px solid var(--card-line);
    padding:14px 18px 12px;
  }
  .topbar-row{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .match-title{
    font-weight:800;
    font-size:15px;
    letter-spacing:0.02em;
    text-transform:uppercase;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .innings-pill{
    appearance:none; border:none; cursor:pointer; font-family:inherit;
    flex-shrink:0;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--turf-strong);
    background:var(--turf-tint);
    border-radius:20px;
    padding:4px 10px;
    white-space:nowrap;
  }
  .innings-pill:hover{ filter:brightness(0.95); }
  .innings-pill.locked{ cursor:default; color:var(--ink-soft); background:var(--card-line); }
  .innings-pill.locked:hover{ filter:none; }
  .icon-btn{
    flex-shrink:0; appearance:none; border:1px solid var(--card-line); background:transparent;
    color:var(--ink-soft); border-radius:8px; width:32px; height:32px; font-size:15px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn:hover{ border-color:var(--ink-soft); color:var(--ink); }

  .hero{
    position: relative;
    background: radial-gradient(circle at 32% 26%, #f7b044 0%, #c96a1f 52%, #5e2e10 100%);
    padding: 40px 24px 32px;
    text-align: center;
    color: #fff;
  }
  .boot-splash{
    position: fixed; inset: 0; z-index: 9999;
    min-height: 100vh; min-height: 100dvh;
    display: flex; justify-content: center;
    background: radial-gradient(circle at 32% 26%, #f7b044 0%, #c96a1f 52%, #5e2e10 100%);
    cursor: pointer;
    overflow: hidden;
  }
  .boot-splash-img{
    position: relative; width: 100%; max-width: 460px; height: 100%;
    background: url("splash-batsman.png") center top / cover no-repeat;
  }
  .boot-splash-title{
    position: absolute; left: 0; right: 0; bottom: 5%; text-align: center;
    font-weight: 800; line-height: 1.02;
  }
  .boot-splash-title .line1, .boot-splash-title .line2{
    font-size: min(10.1vw, 46px); letter-spacing: -0.01em;
    text-shadow: 0 3px 10px rgba(0,0,0,0.5);
    opacity: 0;
    animation: bootTitleIn 0.5s ease forwards;
    animation-delay: 0.4s;
  }
  .boot-splash-title .line1{ color: #fff; }
  .boot-splash-title .line2{ color: #7fe0c4; animation-delay: 0.55s; }
  @keyframes bootTitleIn{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    .boot-splash-title .line1, .boot-splash-title .line2{ animation: none; opacity: 1; transform: none; }
  }
  .hero-menu-btn, .hero-bell-btn{
    position: absolute;
    appearance: none; cursor: pointer;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.35);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    color: #fff; font-size: 17px;
    display: flex; align-items: center; justify-content: center;
    transition: transform .15s ease, background .15s ease;
  }
  .hero-menu-btn{ top: 14px; left: 14px; }
  .hero-bell-btn{ top: 14px; right: 14px; }
  .hero-menu-btn svg{ width: 18px; height: 18px; display: block; }
  .hero-menu-btn:hover, .hero-bell-btn:hover{ background: rgba(255,255,255,0.28); }
  .hero-menu-btn:active, .hero-bell-btn:active{ transform: scale(0.92); }
  .hero-bell-btn .notif-dot{
    position: absolute; top: 6px; right: 6px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--ball, #e2685a); border: 1.5px solid rgba(0,0,0,0.3);
  }
  .home-chat-btn{
    position: absolute;
    bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    right: 18px;
    width: 56px; height: 56px; border-radius: 50%;
    appearance: none; border: none; cursor: pointer;
    background: var(--turf); color: #fff; font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.3); z-index: 5;
  }
  .home-chat-btn:hover{ filter: brightness(1.06); }
  .home-chat-btn:active{ transform: scale(0.94); }
  .menu-list{ display: flex; flex-direction: column; gap: 10px; }
  .menu-item{
    display: flex; align-items: center; gap: 12px;
    background: var(--accent-tint, var(--card)); border: 1.5px solid var(--card-line); border-radius: 10px;
    padding: 12px 16px; font-size: 14.5px; font-weight: 700; color: var(--ink);
    cursor: pointer; text-align: left; width: 100%;
  }
  .menu-item:hover{ border-color: var(--accent, var(--turf)); }
  .menu-item .menu-ico-chip{
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    background: var(--chip-glass);
    box-shadow: inset 0 0 0 1.5px var(--accent, var(--turf));
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .menu-item .menu-arrow{ margin-left: auto; color: var(--accent, var(--ink-soft)); font-weight: 700; }
  .btn-back{
    width: 100%; padding: 11px 12px;
    background: var(--ink); color: var(--paper); border: none;
    font-size: 14px; font-weight: 700;
  }
  .btn-back:hover{ filter: brightness(1.15); }
  .lang-toggle{ display: flex; gap: 8px; margin: -6px 0 14px; }
  .extras-toggle-row{ display: flex; flex-wrap: wrap; gap: 8px; }
  .extras-toggle-row .lang-btn{ flex: 1 1 auto; }
  .lang-btn{
    appearance: none; cursor: pointer; flex: 1;
    border: 1.5px solid var(--card-line); background: var(--card); color: var(--ink-soft);
    border-radius: 20px; padding: 7px 12px; font-size: 13px; font-weight: 700;
  }
  .lang-btn.active{ background: var(--turf); color: #fff; border-color: var(--turf); }
  .info-body{ font-size: 14px; line-height: 1.7; color: var(--ink); }
  .info-body p{ margin: 0 0 14px; }
  .info-body ol, .info-body ul{ margin: 0 0 14px; padding-left: 20px; }
  .info-body li{ margin-bottom: 8px; }
  .contact-row{
    display: flex; align-items: center; gap: 12px;
    padding: 12px 0; border-top: 1px solid var(--card-line);
    font-size: 14.5px; font-weight: 600;
  }
  .contact-row:first-of-type{ border-top: none; }
  .contact-row .contact-ico{ font-size: 18px; flex-shrink: 0; }
  .contact-row a{ color: var(--turf-strong); text-decoration: none; }
  .contact-row a:hover{ text-decoration: underline; }
  @keyframes boundaryPop{
    0%{ transform: translate(-50%,-50%) scale(0.3) rotate(-10deg); opacity: 0; }
    18%{ transform: translate(-50%,-50%) scale(1.18) rotate(4deg); opacity: 1; }
    32%{ transform: translate(-50%,-50%) scale(1) rotate(0deg); opacity: 1; }
    78%{ transform: translate(-50%,-50%) scale(1); opacity: 1; }
    100%{ transform: translate(-50%,-50%) scale(1.35); opacity: 0; }
  }
  .boundary-popup{
    position: fixed; top: 38%; left: 50%; transform: translate(-50%,-50%);
    z-index: 60; pointer-events: none; text-align: center;
    animation: boundaryPop 1.15s ease-out forwards;
  }
  .boundary-popup .boundary-num{
    font-size: 130px; font-weight: 900; line-height: 1;
    text-shadow: 0 6px 22px rgba(0,0,0,0.45);
  }
  .boundary-popup .boundary-label{
    font-size: 26px; font-weight: 800; letter-spacing: 0.08em; margin-top: 2px;
    text-shadow: 0 3px 12px rgba(0,0,0,0.45);
  }
  .boundary-popup.four .boundary-num, .boundary-popup.four .boundary-label{ color: var(--turf-strong); }
  .boundary-popup.six .boundary-num, .boundary-popup.six .boundary-label{ color: var(--bail); }
  @media (prefers-reduced-motion: reduce){
    .boundary-popup{ animation: none; opacity: 1; }
  }
  .chat-messages{
    display: flex; flex-direction: column; gap: 10px;
    max-height: 48vh; overflow-y: auto; padding: 2px 2px 4px;
  }
  .chat-bubble{ max-width: 84%; padding: 10px 13px; border-radius: 12px; font-size: 13.5px; line-height: 1.5; }
  .chat-bubble-user{ align-self: flex-end; background: var(--turf); color: #fff; border-bottom-right-radius: 3px; }
  .chat-bubble-bot{ align-self: flex-start; background: var(--paper); border: 1px solid var(--card-line); color: var(--ink); border-bottom-left-radius: 3px; }
  .chat-google-btn{
    display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 700;
    color: var(--turf-strong); text-decoration: none; border: 1px solid var(--card-line);
    border-radius: 20px; padding: 5px 11px;
  }
  .chat-google-btn:hover{ border-color: var(--turf); }
  .chat-suggestions{ display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chat-chip{
    appearance: none; border: 1px solid var(--card-line); background: var(--paper); color: var(--ink-soft);
    border-radius: 20px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .chat-chip:hover{ border-color: var(--turf); color: var(--ink); }
  .chat-input-row{ display: flex; gap: 8px; margin-top: 12px; }
  .chat-input-row input{
    flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    border-radius: 20px; padding: 10px 16px; font-size: 14px;
  }
  .chat-input-row input:focus{ border-color: var(--turf); }
  .chat-send-btn{
    appearance: none; border: none; cursor: pointer; flex-shrink: 0;
    width: 40px; height: 40px; border-radius: 50%; background: var(--turf); color: #fff; font-size: 16px;
  }
  .chat-send-btn:hover{ filter: brightness(1.06); }
  .hero-icon{ border-radius: 50%; box-shadow: 0 12px 28px rgba(30,15,0,0.4); margin-bottom: 16px; background:#fff; }
  .hero-title{ font-size: 27px; font-weight: 800; letter-spacing: -0.01em; text-shadow: 0 1px 3px rgba(0,0,0,0.3); }
  .hero-tag{
    font-size: 13.5px; color: rgba(255,255,255,0.9); margin: 6px auto 0;
    max-width: 28ch; line-height: 1.5;
  }
  .pitch-list{ display: flex; flex-direction: column; gap: 13px; margin-bottom: 6px; }
  .pitch-item{ display: flex; align-items: flex-start; gap: 12px; font-size: 13.5px; color: var(--ink-soft); line-height: 1.5; }
  .pitch-ico{ font-size: 18px; flex-shrink: 0; line-height: 1.3; }
  .paused-note{
    background: var(--bail-tint); color: var(--bail); border-radius: 8px;
    padding: 10px 14px; font-size: 13px; font-weight: 700; text-align: center;
  }

  main{ flex:1; padding:18px; display:flex; flex-direction:column; gap:16px; }

  .eyebrow{
    font-size:11px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--turf-strong); margin:0 0 6px;
  }
  h1{
    font-size:26px; margin:0 0 4px; text-wrap:balance; letter-spacing:-0.01em;
  }
  .lede{ color:var(--ink-soft); font-size:14.5px; line-height:1.5; margin:0 0 18px; max-width:34ch; }

  .card{
    background:var(--card);
    border:1px solid var(--card-line);
    border-radius:10px;
    padding:18px;
  }
  .field{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
  .field label{ font-size:11.5px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-soft); }
  .field input{
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    border-radius:7px;
    padding:11px 12px;
    font-size:16px;
    width:100%;
  }
  .field input:focus{ border-color:var(--turf); }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; min-width:0; }

  .btn{
    appearance:none; border:none; cursor:pointer;
    border-radius:8px;
    font-weight:700;
    font-size:15px;
    padding:13px 16px;
    transition:transform .08s ease, filter .15s ease;
  }
  @media (prefers-reduced-motion: reduce){ .btn{ transition:none; } }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--turf); color:#fff; width:100%; }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{
    background:transparent; color:var(--ink-soft); border:1px solid var(--line);
    font-size:12.5px; font-weight:700; letter-spacing:0.02em; padding:9px 12px;
  }
  .btn-ghost:hover{ border-color:var(--ink-soft); color:var(--ink); }
  .btn-export{
    background:var(--bail-tint); color:var(--bail); border:1.5px solid var(--bail);
    width:100%;
  }
  .btn-export:hover{ filter:brightness(0.96); }
  .btn-choice{
    background:var(--card); color:var(--ink); border:1.5px solid var(--card-line);
    width:100%; text-align:left; padding:16px; font-size:16px; font-weight:700;
    display:flex; justify-content:space-between; align-items:center;
  }
  .btn-choice:hover{ border-color:var(--turf); }
  .btn-choice .arrow{ color:var(--turf); font-weight:400; }

  .error-text{ color:var(--ball); font-size:13px; font-weight:600; margin:-6px 0 12px; }

  .scoreboard{
    background:var(--card); border:1px solid var(--card-line); border-radius:12px;
    padding:20px 20px 16px;
  }
  .sb-batting{ font-size:12px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; }
  .sb-main{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  .sb-score{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:44px; font-weight:700; letter-spacing:-0.01em; }
  .sb-overs{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:16px; color:var(--ink-soft); }
  .sb-sub{ margin-top:10px; padding-top:10px; border-top:1px solid var(--card-line); font-size:13px; color:var(--ink-soft); display:flex; flex-wrap:wrap; gap:14px; font-variant-numeric:tabular-nums; }
  .sb-sub b{ color:var(--ink); font-weight:700; }

  .crew{ display:flex; gap:10px; }
  .crew-chip{
    flex:1; background:var(--card); border:1px solid var(--card-line); border-radius:10px;
    padding:12px 14px; min-width:0;
  }
  .crew-chip.on-strike{ border-color:var(--turf); box-shadow:inset 0 0 0 1px var(--turf); }
  .crew-label{ font-size:10.5px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-soft); display:flex; align-items:center; gap:6px; margin-bottom:5px; }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--turf); flex-shrink:0; }
  .dot.hollow{ background:transparent; border:1.5px solid var(--ink-soft); }
  .crew-name{ font-weight:700; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .crew-figs{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:13px; color:var(--ink-soft); margin-top:2px; }
  .crew-boundaries{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:11px; color:var(--turf-strong); margin-top:3px; }

  .bowler-row{ display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--card-line); border-radius:10px; padding:12px 14px; gap:10px; }
  .bowler-info{ min-width:0; }
  .bowler-name{ font-weight:700; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bowler-figs{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:13px; color:var(--ink-soft); margin-top:2px; }

  .over-strip{ display:flex; align-items:center; gap:8px; }
  .over-label{ font-size:11px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-soft); flex-shrink:0; }
  .ball-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    font-family:var(--font-mono); font-size:12.5px; font-weight:700;
    width:26px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center;
    background:var(--paper); border:1px solid var(--line); color:var(--ink-soft);
  }

<div class="shell" id="app"><div class="boot-splash" id="bootSplash" title="Tap to skip"><div class="boot-splash-img"><div class="boot-splash-title"><div class="line1">Cric</div><div class="line2">Score</div></div></div></div></div>

<script>
const STORAGE_KEY = "gullyScorerState_v1";
const ALL_EXTRAS_ON = { wide:true, noBall:true, bye:true, legBye:true };
function tryLoadFromHash(){
  if(!location.hash || location.hash.indexOf("state=")===-1) return null;
  try{
    const raw = location.hash.replace(/^#?state=/, "");
    const parsed = JSON.parse(decodeURIComponent(raw));
    return migrateState(parsed);
  }catch(e){ return null; }
}
const hashImport = tryLoadFromHash();
let state = hashImport || load() || { ...freshState(), screen: "welcome" };
let undoStack = [];
if(hashImport){
  history.replaceState(null, "", location.pathname + location.search);
  save();
} else {
  const today = new Date().toISOString().slice(0, 10);
  const midMatchScreens = ["scoring", "toss", "break"];
  if(state.lastOpenDate !== today && !midMatchScreens.includes(state.screen)){
    state.screen = "welcome";
  }
  state.lastOpenDate = today;
  save();
}

function freshState(){
  return {
    screen: "setup",
    teamAName: "", teamBName: "",
    oversLimit: 6,
    extrasEnabled: { ...ALL_EXTRAS_ON },
    inningsIndex: 0,
    innings: [null, null],
    formError: "",
    manOfMatch: null,
    matchId: null,
    matchDate: null,
    lastOpenDate: null,
    infoKind: null,
    homeReturnScreen: null,
    contentLang: "en"
  };
}
function emptyBatsman(){ return { name:null, runs:0, balls:0, out:false, ones:0, twos:0, threes:0, fours:0, sixes:0 }; }
function freshInning(battingKey, bowlingKey){
  return {
    battingKey, bowlingKey,
    runs:0, wickets:0, legalBalls:0, currentOverRuns:0,
    extras:{ wide:0, noBall:0, bye:0, legBye:0 },
    batsmen:{ A: emptyBatsman(), B: emptyBatsman() },
    onStrike:"A",
    currentBowler:null,
    bowlers:{},
    thisOverBalls:[],
    fallOfWickets:[],
    retired:[],
    ended:false, endReason:null
  };
}

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function migrateBatsman(b){
  if(!b) return b;
  ["ones","twos","threes","fours","sixes"].forEach(k=>{ if(typeof b[k]!=="number") b[k]=0; });
  return b;
}
function migrateState(s){
  if(!s) return s;
  if(!s.extrasEnabled) s.extrasEnabled = { ...ALL_EXTRAS_ON };
  (s.innings||[]).forEach(inning=>{
    if(!inning) return;
    if(inning.batsmen){ migrateBatsman(inning.batsmen.A); migrateBatsman(inning.batsmen.B); }
    if(!inning.retired) inning.retired = [];
    if(typeof inning.currentOverRuns !== "number") inning.currentOverRuns = 0;
    (inning.fallOfWickets||[]).forEach(f=>{
      migrateBatsman(f);
      if(f.bowler===undefined) f.bowler=null;
      if(f.atOver===undefined) f.atOver=null;
    });
    Object.values(inning.bowlers||{}).forEach(bf=>{
      if(typeof bf.maidens !== "number") bf.maidens = 0;
    });
  });
  return s;
}
function load(){ try{ const raw=localStorage.getItem(STORAGE_KEY); return raw?migrateState(JSON.parse(raw)):null; }catch(e){ return null; } }
function copyrightLine(){
  return `<div class="copyright">&copy; ${new Date().getFullYear()} Sushant Kumar &mdash; Cric Score. All rights reserved.</div>`;
}
const NOTIF_SEEN_KEY = "gullyScorerNotifSeen_v1";
function hasUnseenNotifications(){
  return !localStorage.getItem(NOTIF_SEEN_KEY);
}
function goToNotifications(){
  localStorage.setItem(NOTIF_SEEN_KEY, "1");
  goToInfo("notifications");
}
function pushUndo(){
  const snap = JSON.parse(JSON.stringify(state));
  undoStack.push(snap);
  if(undoStack.length>200) undoStack.shift();
}
function undo(){
  if(!undoStack.length) return;
  state = undoStack.pop();
  save(); render();
}

function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function teamName(key, s){ s = s || state; return key==="A" ? (s.teamAName||"Team A") : (s.teamBName||"Team B"); }
function matchResult(s){
  const i1 = s.innings[0], i2 = s.innings[1];
  if(i2.runs > i1.runs){
    const ballsLeft = s.oversLimit*6 - i2.legalBalls;
    return { text: `${teamName(i2.battingKey,s)} won, chasing it down` + (ballsLeft>0 ? ` with ${oversText(ballsLeft)} overs unused` : ""), tied:false };
  }
  if(i2.runs < i1.runs){
    return { text: `${teamName(i1.battingKey,s)} won by ${i1.runs - i2.runs} run${(i1.runs-i2.runs)===1?"":"s"}`, tied:false };
  }
  return { text:"Match tied", tied:true };
}
function otherKey(key){ return key==="A" ? "B" : "A"; }
function oversText(legalBalls){ return Math.floor(legalBalls/6) + "." + (legalBalls%6); }
function currentInning(){ return state.innings[state.inningsIndex]; }
function val(id){ const el=document.getElementById(id); return el ? el.value.trim() : ""; }

function toggleStrike(inning){ inning.onStrike = inning.onStrike==="A" ? "B" : "A"; }

function checkInningsEnd(inning){
  let ended=false, reason=null;
  if(inning.legalBalls >= state.oversLimit*6){ ended=true; reason="overs"; }
  if(!ended && state.inningsIndex===1){
    const target = state.innings[0].runs+1;
    if(inning.runs >= target){ ended=true; reason="target"; }
  }
  if(ended){ inning.ended=true; inning.endReason=reason; }
}
function afterLegalBall(inning){
  const overJustCompleted = inning.legalBalls % 6 === 0;
  if(overJustCompleted){
    const bowlerName = inning.currentBowler;
    if(bowlerName && inning.bowlers[bowlerName] && (inning.currentOverRuns||0) === 0){
      inning.bowlers[bowlerName].maidens = (inning.bowlers[bowlerName].maidens||0) + 1;
    }
    inning.currentOverRuns = 0;
    toggleStrike(inning);
    inning.thisOverBalls = [];
  }
  checkInningsEnd(inning);
  if(overJustCompleted && !inning.ended){
    inning.currentBowler = null;
  }
}
function finishAction(){
  const inning = currentInning();
  if(inning.ended){
    state.screen = state.inningsIndex===0 ? "break" : "result";
    if(state.screen==="result"){
      archiveMatch();
      state.homeReturnScreen = null;
    }
  }
  save(); render();
}
function goHome(){
  state.homeReturnScreen = state.screen;
  state.screen = "welcome";
  save(); render();
}
function backToWelcome(){
  state.screen = "welcome";
  save(); render();
}
function resumeMatch(){
  state.screen = state.homeReturnScreen || "scoring";
  save(); render();
}
function editOvers(){
  if(state.inningsIndex===1){
    alert("Overs can't be changed once the 2nd innings has started — this app doesn't use DLS-style target recalculation.");
    return;
  }
  const inning = currentInning();
  const raw = prompt(`Overs per innings (currently ${state.oversLimit}):`, state.oversLimit);
  if(raw === null) return;
  const n = parseInt(raw, 10);
  if(!n || n < 1){ alert("Enter a valid number of overs (1 or more)."); return; }
  pushUndo();
  state.oversLimit = n;
  if(inning && !inning.ended){
    checkInningsEnd(inning);
    if(inning.ended){
      state.screen = state.inningsIndex===0 ? "break" : "result";
      if(state.screen==="result"){
        archiveMatch();
        state.homeReturnScreen = null;
      }
    }
  }
  save(); render();
}
function hasPending(){
  const inning = currentInning();
  if(!inning) return true;
  return !inning.batsmen.A.name || !inning.batsmen.B.name || !inning.currentBowler;
}

function startSetup(){
  const a = val("teamAInput"), b = val("teamBInput"), overs = parseInt(val("oversInput"),10);
  if(!a || !b){ state.formError="Enter both team names."; save(); render(); return; }
  if(!overs || overs<1){ state.formError="Overs must be at least 1."; save(); render(); return; }
  state.teamAName=a; state.teamBName=b; state.oversLimit=overs; state.formError="";
  state.matchId = (crypto.randomUUID ? crypto.randomUUID() : (Date.now()+"-"+Math.random().toString(36).slice(2)));
  state.matchDate = Date.now();
  state.screen="toss";
  save(); render();
}
function chooseBattingFirst(key){
  const bowlKey = otherKey(key);
  state.innings[0] = freshInning(key, bowlKey);
  state.inningsIndex = 0;
  state.screen = "scoring";
  save(); render();
}
function confirmEntries(){
  const inning = currentInning();
  const needA = !inning.batsmen.A.name, needB = !inning.batsmen.B.name, needBowler = !inning.currentBowler;
  const a = needA ? val("entryA") : null;
  const b = needB ? val("entryB") : null;
  const bo = needBowler ? val("entryBowler") : null;
  if((needA && !a) || (needB && !b) || (needBowler && !bo)){
    state.formError = "Enter a name for every open slot.";
    save(); render(); return;
  }
  pushUndo();
  if(needA) inning.batsmen.A.name = a;
  if(needB) inning.batsmen.B.name = b;
  if(needBowler){
    inning.currentBowler = bo;
    if(!inning.bowlers[bo]) inning.bowlers[bo] = { balls:0, runs:0, wickets:0, maidens:0 };
  }
  state.formError = "";
  save(); render();
}
function changeBowler(){
  if(hasPending()) return;
  pushUndo();
  const inning = currentInning();
  const name = inning.currentBowler;
  if(inning.bowlers[name] && inning.bowlers[name].balls === 0){
    delete inning.bowlers[name];
  }
  inning.currentBowler = null;
  save(); render();
}
function addRuns(n){
  if(hasPending()) return;
  pushUndo();
  const inning = currentInning();
  const key = inning.onStrike;
  inning.batsmen[key].runs += n;
  inning.batsmen[key].balls += 1;
  if(n===1) inning.batsmen[key].ones += 1;
  else if(n===2) inning.batsmen[key].twos += 1;
  else if(n===3) inning.batsmen[key].threes += 1;
  else if(n===4) inning.batsmen[key].fours += 1;
  else if(n===6) inning.batsmen[key].sixes += 1;
  inning.runs += n;
  inning.legalBalls += 1;
  inning.currentOverRuns = (inning.currentOverRuns||0) + n;
  inning.bowlers[inning.currentBowler].balls += 1;
  inning.bowlers[inning.currentBowler].runs += n;
  inning.thisOverBalls.push(n===0 ? "•" : String(n));
  if(n===1 || n===3) toggleStrike(inning);
  afterLegalBall(inning);
  finishAction();
  if(n===4 || n===6) showBoundaryPopup(n);
}
function showBoundaryPopup(n){
  const el = document.createElement("div");
  el.className = "boundary-popup " + (n===6 ? "six" : "four");
  el.innerHTML = `<div class="boundary-num">${n}</div><div class="boundary-label">${n===6?"SIX!":"FOUR!"}</div>`;
  document.body.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 1200);
}
function addExtra(type){
  if(hasPending()) return;
  pushUndo();
  const inning = currentInning();
  inning.runs += 1;
  inning.extras[type] += 1;
  inning.currentOverRuns = (inning.currentOverRuns||0) + 1;
  inning.bowlers[inning.currentBowler].runs += 1;
  inning.thisOverBalls.push(type==="wide" ? "wd" : "nb");
  save(); render();
}
function addByeType(type){
  if(hasPending()) return;
  pushUndo();
  const inning = currentInning();
  inning.runs += 1;
  inning.extras[type] += 1;
  inning.legalBalls += 1;
  inning.currentOverRuns = (inning.currentOverRuns||0) + 1;
  inning.bowlers[inning.currentBowler].balls += 1;
  inning.batsmen[inning.onStrike].balls += 1;
  inning.thisOverBalls.push(type==="bye" ? "b" : "lb");
  toggleStrike(inning);
  afterLegalBall(inning);
  finishAction();
}
function addWicket(){
  if(hasPending()) return;
  pushUndo();
  const inning = currentInning();
  const key = inning.onStrike;
  const b = inning.batsmen[key];
  b.out = true;
  b.balls += 1;
  inning.legalBalls += 1;
  inning.wickets += 1;
  inning.bowlers[inning.currentBowler].balls += 1;
  inning.bowlers[inning.currentBowler].wickets += 1;
  inning.fallOfWickets.push({
    name:b.name, runs:b.runs, balls:b.balls, atScore:inning.runs, wicketNo:inning.wickets,
    atOver: oversText(inning.legalBalls),
    bowler: inning.currentBowler,
    ones:b.ones, twos:b.twos, threes:b.threes, fours:b.fours, sixes:b.sixes
  });
  inning.thisOverBalls.push("W");
  afterLegalBall(inning);
  inning.batsmen[key] = emptyBatsman();
  finishAction();
}
function openWicketMenu(){
  if(hasPending()) return;
  state.wicketMenuOpen = true;
  save(); render();
}
function closeWicketMenu(){
  state.wicketMenuOpen = false;
  save(); render();
}
function confirmBowlerWicket(){
  state.wicketMenuOpen = false;
  addWicket();
}
function confirmRunOut(dismissedKey){
  state.wicketMenuOpen = false;
  addRunOut(dismissedKey);
}
function addRunOut(dismissedKey){
  if(hasPending()) return;
  pushUndo();
  const inning = currentInning();
  const strikerKey = inning.onStrike;
  const b = inning.batsmen[dismissedKey];
  b.out = true;
  if(dismissedKey === strikerKey) b.balls += 1;
  inning.legalBalls += 1;
  inning.wickets += 1;
  inning.bowlers[inning.currentBowler].balls += 1;
  inning.fallOfWickets.push({
    name:b.name, runs:b.runs, balls:b.balls, atScore:inning.runs, wicketNo:inning.wickets,
    atOver: oversText(inning.legalBalls),
    bowler: "run out",
    ones:b.ones, twos:b.twos, threes:b.threes, fours:b.fours, sixes:b.sixes
  });
  inning.thisOverBalls.push("W");
  afterLegalBall(inning);
  inning.batsmen[dismissedKey] = emptyBatsman();
  finishAction();
}
function openRetireMenu(){
  if(hasPending()) return;
  state.retireMenuOpen = true;
  save(); render();
}
function closeRetireMenu(){
  state.retireMenuOpen = false;
  save(); render();
}
function confirmRetireHurt(key){
  state.retireMenuOpen = false;
  retireBatsman(key);
}
function retireBatsman(key){
  if(hasPending()) return;
  pushUndo();
  const inning = currentInning();
  const b = inning.batsmen[key];
  inning.retired.push({
    name:b.name, runs:b.runs, balls:b.balls,
    ones:b.ones, twos:b.twos, threes:b.threes, fours:b.fours, sixes:b.sixes
  });
  inning.batsmen[key] = emptyBatsman();
  save(); render();
}
function renameBatsman(inningIndex, ref){
  const inning = state.innings[inningIndex];
  if(!inning) return;

function battingList(inning){
  const list = inning.fallOfWickets.map((f,idx)=>({ ...f, out:true, fowIndex:idx }));
  (inning.retired||[]).forEach((r,idx)=>{ list.push({ ...r, out:false, retired:true, retiredIndex:idx }); });
  ["A","B"].forEach(k=>{ if(inning.batsmen[k].name) list.push({ ...inning.batsmen[k], out:false, liveKey:k }); });
  return list;
}
function allPlayers(s){
  s = s || state;
  const map = {};
  function ensure(name, teamKey){
    if(!map[name]) map[name] = { name, teamKey, runs:0, balls:0, fours:0, sixes:0, wickets:0, ballsBowled:0, runsConceded:0 };
    return map[name];
  }
  s.innings.forEach(inning=>{
    if(!inning) return;
    battingList(inning).forEach(p=>{
      const e = ensure(p.name, inning.battingKey);
      e.runs += p.runs; e.balls += p.balls; e.fours += (p.fours||0); e.sixes += (p.sixes||0);
    });
    Object.entries(inning.bowlers).filter(([,f])=>f.balls>0).forEach(([name,f])=>{
      const e = ensure(name, inning.bowlingKey);
      e.wickets += f.wickets; e.ballsBowled += f.balls; e.runsConceded += f.runs;
    });
  });
  return Object.values(map);
}

}

let fireworksAudioCtx = null;
function getFireworksAudioCtx(){
  if(!fireworksAudioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    fireworksAudioCtx = new AC();
  }
  if(fireworksAudioCtx.state === "suspended"){
    fireworksAudioCtx.resume().catch(()=>{});
  }
  return fireworksAudioCtx;
}
function playCrackleSound(){
  const ac = getFireworksAudioCtx();
  if(!ac) return;
  const now = ac.currentTime;

  const osc = ac.createOscillator();
  osc.type = "sine";
  osc.frequency.setValueAtTime(160, now);
  osc.frequency.exponentialRampToValueAtTime(50, now + 0.22);
  const boomGain = ac.createGain();
  boomGain.gain.setValueAtTime(0.4, now);
  boomGain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
  osc.connect(boomGain).connect(ac.destination);
  osc.start(now);
  osc.stop(now + 0.3);

  const crackleCount = 5 + Math.floor(Math.random()*4);
  for(let i=0; i<crackleCount; i++){
    const t = now + 0.03 + Math.random()*0.28;
    const dur = 0.02 + Math.random()*0.02;
    const bufferSize = Math.max(1, Math.floor(ac.sampleRate * dur));
    const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
    const data = buffer.getChannelData(0);
    for(let j=0; j<bufferSize; j++){ data[j] = (Math.random()*2-1) * (1 - j/bufferSize); }
    const noise = ac.createBufferSource();
    noise.buffer = buffer;
    const filter = ac.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.value = 1200 + Math.random()*2600;
    filter.Q.value = 0.8;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.22 + Math.random()*0.1, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    noise.connect(filter).connect(g).connect(ac.destination);
    noise.start(t);
  }
}
function playFireworks(){
  const canvas = document.getElementById("fireworksCanvas");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;

  const COLORS = ["#2f6b4f", "#5aab7c", "#b23a2e", "#dba53f", "#f6f3ea"];
  let particles = [];
  function burst(x, y){
    playCrackleSound();
    const count = 34;
    for(let i=0; i<count; i++){
      const angle = (Math.PI*2*i)/count + Math.random()*0.3;
      const speed = (2 + Math.random()*3) * dpr;
      particles.push({
        x, y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        color: COLORS[Math.floor(Math.random()*COLORS.length)],
        alpha: 1,
        size: (2 + Math.random()*2) * dpr
      });
    }
  }

  const burstCount = 6;
  const bursts = [];
  for(let i=0; i<burstCount; i++){
    bursts.push({
      time: i * 380,
      x: (0.2 + Math.random()*0.6) * canvas.width,
      y: (0.16 + Math.random()*0.28) * canvas.height
    });
  }

  const start = performance.now();
  let bIdx = 0;
  function frame(now){
    if(!document.getElementById("fireworksCanvas")) return;
    const elapsed = now - start;
    while(bIdx < bursts.length && elapsed >= bursts[bIdx].time){
      burst(bursts[bIdx].x, bursts[bIdx].y);
      bIdx++;
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p=>{
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05 * dpr;
      p.alpha -= 0.012;
    });
    particles = particles.filter(p=>p.alpha>0);
    particles.forEach(p=>{
      ctx.globalAlpha = Math.max(p.alpha, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    if(elapsed < 3600 || particles.length>0){
      requestAnimationFrame(frame);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  requestAnimationFrame(frame);
}

function matchFaq(question){
  const q = question.toLowerCase();
  let best = null, bestScore = 0;
  CRICKET_FAQ.forEach(item=>{
    let score = 0;
    item.kw.forEach(k=>{ if(q.includes(k)) score += k.split(" ").length; });
    if(score > bestScore){ bestScore = score; best = item; }
  });
  return best;
}

    return `<div class="chat-bubble chat-bubble-bot">${esc(m.text)}${googleBtn}</div>`;
  }).join("");
  return `
    <main>
      <div class="eyebrow">💬 Menu</div>
      <h1>Ask about cricket</h1>
      <p class="lede">Common rules, answered instantly. Anything else, I'll hand you off to Google.</p>
      <div class="card" style="padding:14px;">
        <div id="chatMessages" class="chat-messages">
          ${bubbles || `<div class="chat-bubble chat-bubble-bot">Ask me something like "What is LBW?" or tap a suggestion below.</div>`}
        </div>
        <div class="chat-suggestions">
          ${suggestions.map(s=>`<button class="chat-chip" onclick="askChat('${esc(s).replace(/'/g,"\\'")}')">${esc(s)}</button>`).join("")}
        </div>
        <div class="chat-input-row">
          <input id="chatInput" type="text" placeholder="Ask a cricket question…" onkeydown="chatInputKeydown(event)">
          <button class="chat-send-btn" onclick="sendChatMessage()">➤</button>
        </div>
      </div>
      <button class="btn-back" onclick="closeChat()">← Back</button>
    </main>
    <footer>${copyrightLine()}</footer>
  `;
}

function tossScreen(){

function entryFormHtml(inning){
  const needA = !inning.batsmen.A.name, needB = !inning.batsmen.B.name, needBowler = !inning.currentBowler;
  const isInningsStart = needA && needB && needBowler;
  const needNewBatsman = needA || needB;
  let title, hint;
  if(isInningsStart){
    title = "Send the openers in";
    hint = "Enter the two openers and the first bowler to start this innings.";
  } else if(needNewBatsman && needBowler){
    title = "New batsman &amp; new over";
    hint = "A wicket fell on the last ball of the over — enter the incoming batsman and the next bowler.";
  } else if(needBowler){
    title = "Over complete — who's bowling next?";
    hint = "Enter the name of the bowler for this end.";
  } else {
    title = "New batsman";
    hint = "Enter the name of the incoming batsman.";
  }
  return `
    <div class="card entry-card">
      <div class="entry-title">${title}</div>
      <div class="entry-hint">${hint}</div>
      ${needA ? `<div class="field"><label for="entryA">Batsman — on strike</label><input id="entryA" type="text" maxlength="24" placeholder="Name"></div>` : ""}
      ${needB ? `<div class="field"><label for="entryB">Batsman — non-strike</label><input id="entryB" type="text" maxlength="24" placeholder="Name"></div>` : ""}
      ${needBowler ? `<div class="field"><label for="entryBowler">Bowler</label><input id="entryBowler" type="text" maxlength="24" placeholder="Name"></div>` : ""}
      ${state.formError ? `<div class="error-text">${esc(state.formError)}</div>` : ""}
      <button class="btn btn-primary" onclick="confirmEntries()">${isInningsStart ? "Start innings" : "Confirm"}</button>
    </div>
  `;
}

function scoringScreen(){
  const inning = currentInning();
  const battingName = teamName(inning.battingKey), bowlingName = teamName(inning.bowlingKey);
  const crr = inning.legalBalls>0 ? (inning.runs / (inning.legalBalls/6)).toFixed(2) : "0.00";
  let subLine = "";
  if(state.inningsIndex===1){
    const target = state.innings[0].runs+1;
    const needed = Math.max(target - inning.runs, 0);
    const ballsLeft = Math.max(state.oversLimit*6 - inning.legalBalls, 0);
    const rrr = ballsLeft>0 ? (needed*6/ballsLeft).toFixed(2) : "—";
    subLine = `<div class="sb-sub"><span>Target <b>${target}</b></span><span>Need <b>${needed}</b> off <b>${ballsLeft}</b> balls</span><span>RRR <b>${rrr}</b></span></div>`;
  }

  const pending = !inning.batsmen.A.name || !inning.batsmen.B.name || !inning.currentBowler;

  const strikerKey = inning.onStrike, nonKey = otherKey(strikerKey);
  const striker = inning.batsmen[strikerKey], nonStriker = inning.batsmen[nonKey];

  const crewHtml = (striker.name || nonStriker.name) ? `
    <div class="crew">
      <div class="crew-chip ${striker.name?'on-strike':''}">
        <div class="crew-label"><span class="dot"></span>On strike</div>
        <div class="crew-name">${striker.name?esc(striker.name):"—"}${striker.name ? `<button class="edit-name-btn" onclick="renameBatsman(${state.inningsIndex},{type:'live',key:'${strikerKey}'})" title="Fix name" aria-label="Fix name">&#9998;</button>` : ""}</div>
        <div class="crew-figs">${striker.name? striker.runs+" ("+striker.balls+")" : ""}</div>
        ${striker.name && (striker.fours||striker.sixes) ? `<div class="crew-boundaries">4s ${striker.fours} · 6s ${striker.sixes}</div>` : ""}
      </div>
      <div class="crew-chip">
        <div class="crew-label"><span class="dot hollow"></span>Non-strike</div>
        <div class="crew-name">${nonStriker.name?esc(nonStriker.name):"—"}${nonStriker.name ? `<button class="edit-name-btn" onclick="renameBatsman(${state.inningsIndex},{type:'live',key:'${nonKey}'})" title="Fix name" aria-label="Fix name">&#9998;</button>` : ""}</div>
        <div class="crew-figs">${nonStriker.name? nonStriker.runs+" ("+nonStriker.balls+")" : ""}</div>
        ${nonStriker.name && (nonStriker.fours||nonStriker.sixes) ? `<div class="crew-boundaries">4s ${nonStriker.fours} · 6s ${nonStriker.sixes}</div>` : ""}
      </div>
    </div>
  ` : "";

  const bowlerFigs = inning.currentBowler ? inning.bowlers[inning.currentBowler] : null;
  const bowlerHtml = inning.currentBowler ? `
    <div class="bowler-row">
      <div class="bowler-info">
        <div class="bowler-name">${esc(inning.currentBowler)}</div>
        <div class="bowler-figs">${oversText(bowlerFigs.balls)}-${bowlerFigs.runs}-${bowlerFigs.wickets}</div>
      </div>
      <button class="btn-ghost" onclick="changeBowler()">Change</button>
    </div>
  ` : "";

  const chips = inning.thisOverBalls.map(b=>{
    let cls = "chip";
    if(b==="4"||b==="6") cls += " boundary";
    else if(b==="W") cls += " wicket";
    else if(b==="wd"||b==="nb"||b==="b"||b==="lb") cls += " extra";
    return `<span class="${cls}">${b}</span>`;
  }).join("");
  const overStrip = `<div class="over-strip"><span class="over-label">This over</span><div class="ball-chips">${chips || '<span style="color:var(--ink-soft);font-size:12.5px">not started</span>'}</div></div>`;

  const extrasEnabled = state.extrasEnabled || ALL_EXTRAS_ON;
  const enabledExtras = [
    { key:"wide", label:"Wide", onclick:"addExtra('wide')" },
    { key:"noBall", label:"No ball", onclick:"addExtra('noBall')" },
    { key:"bye", label:"Bye", onclick:"addByeType('bye')" },
    { key:"legBye", label:"Leg bye", onclick:"addByeType('legBye')" }
  ].filter(e=>extrasEnabled[e.key]);
  const extraGridHtml = enabledExtras.length ? `
    <div class="extra-grid" style="grid-template-columns:repeat(${enabledExtras.length},1fr)">
      ${enabledExtras.map(e=>`<button class="extra-btn" onclick="${e.onclick}">${e.label}</button>`).join("")}
    </div>
  ` : "";
  const padHtml = `
    <div class="pad">
      <div class="run-grid">
        ${[0,1,2,3,4,5,6].map(n=>`<button class="run-btn ${(n===4||n===6)?'boundary':''}" onclick="addRuns(${n})">${n}</button>`).join("")}
        <button class="run-btn" onclick="openWicketMenu()" style="visibility:hidden"></button>
      </div>
      ${extraGridHtml}
      <button class="btn wicket-btn" onclick="openWicketMenu()">Wicket</button>
      <div class="util-row">
        <button class="btn-ghost" onclick="undo()">↺ Undo</button>
        <button class="btn-ghost" onclick="openRetireMenu()">🚑 Retired hurt</button>
        <button class="btn-ghost" onclick="endInningsManual()">End innings</button>
      </div>
    </div>
  `;
  const wicketMenuHtml = `
    <div class="card wicket-menu">
      <div class="entry-title">Wicket — who's out, and how?</div>
      <div class="entry-hint">Bowled/caught/stumped/LBW/hit wicket always dismiss the striker. A run out can be either batsman.</div>
      <button class="btn-choice" onclick="confirmBowlerWicket()"><span>${esc(striker.name)} — bowled / caught / stumped / LBW / hit wicket</span></button>
      <button class="btn-choice" onclick="confirmRunOut('${strikerKey}')"><span>${esc(striker.name)} run out <span class="arrow">(striker)</span></span></button>
      <button class="btn-choice" onclick="confirmRunOut('${nonKey}')"><span>${esc(nonStriker.name)} run out <span class="arrow">(non-striker)</span></span></button>
      <button class="btn-ghost" style="width:100%; padding:11px 12px; margin-top:4px;" onclick="closeWicketMenu()">Cancel</button>
    </div>
  `;
  const retireMenuHtml = `
    <div class="card wicket-menu">
      <div class="entry-title">Retired hurt — who's leaving the field?</div>
      <div class="entry-hint">Doesn't count as a wicket. A new batsman comes in next.</div>
      <button class="btn-choice" onclick="confirmRetireHurt('${strikerKey}')"><span>${esc(striker.name)} <span class="arrow">(striker)</span></span></button>
      <button class="btn-choice" onclick="confirmRetireHurt('${nonKey}')"><span>${esc(nonStriker.name)} <span class="arrow">(non-striker)</span></span></button>
      <button class="btn-ghost" style="width:100%; padding:11px 12px; margin-top:4px;" onclick="closeRetireMenu()">Cancel</button>
    </div>
  `;

  return `
    <div class="topbar">
      <div class="topbar-row">
        <button class="icon-btn" onclick="goHome()" title="Home" aria-label="Home">🏠</button>
        <div class="match-title">${esc(state.teamAName)} vs ${esc(state.teamBName)}</div>
        ${state.inningsIndex===0
          ? `<button class="innings-pill" onclick="editOvers()" title="Change overs">${state.oversLimit} OV · INNINGS 1 OF 2 ✎</button>`
          : `<div class="innings-pill locked" title="Overs are locked once the 2nd innings starts">${state.oversLimit} OV · INNINGS 2 OF 2 🔒</div>`}
        <button class="icon-btn" onclick="shareTransferLink()" title="Continue on another device" aria-label="Continue on another device">🔗</button>
      </div>
    </div>
    <main>
      <div class="scoreboard">
        <div class="sb-batting">${esc(battingName)} batting · ${esc(bowlingName)} bowling</div>
        <div class="sb-main">
          <div class="sb-score">${inning.runs}/${inning.wickets}</div>
          <div class="sb-overs">${oversText(inning.legalBalls)} / ${state.oversLimit} ov · CRR ${crr}</div>
        </div>
        ${subLine}
      </div>
      ${pending ? entryFormHtml(inning) : `${crewHtml}${bowlerHtml}${overStrip}${state.wicketMenuOpen ? wicketMenuHtml : state.retireMenuOpen ? retireMenuHtml : padHtml}`}
    </main>
  `;
}

function breakScreen(){
  const inning = state.innings[0];
  const target = inning.runs+1;
  return `
    <main>
      <div class="eyebrow">Innings break</div>
      <h1>${esc(teamName(inning.battingKey))} made ${inning.runs}/${inning.wickets}</h1>

      <button class="btn-ghost" style="width:100%; padding:11px 12px;" onclick="shareTransferLink()">🔗 Continue on another device</button>
      <button class="btn-ghost" style="width:100%; padding:11px 12px;" onclick="goHome()">🏠 Home</button>
    </main>
    <footer>You'll enter the new openers and the opening bowler next.</footer>
  `;
}

function resultScreen(){
  const i1 = state.innings[0], i2 = state.innings[1];
  const { text, tied } = matchResult(state);

  const players = allPlayers().sort((a,b)=>momScore(b)-momScore(a));
  const suggested = players[0];
  const momName = state.manOfMatch || (suggested ? suggested.name : null);
  const momPlayer = players.find(p=>p.name===momName);
  const momCard = momPlayer ? `
    <div class="card mom-card">
      <div class="mom-eyebrow">🏅 Man of the match</div>
      <div class="mom-body">
        <div>
          <div class="mom-name">${esc(momPlayer.name)}</div>
          <div class="mom-figs">${esc(momSummary(momPlayer))} · ${esc(teamName(momPlayer.teamKey))}</div>
        </div>
        <select class="mom-select no-print" onchange="chooseManOfMatch(this.value)" aria-label="Change man of the match">
          ${players.map(p=>`<option value="${esc(p.name)}" ${p.name===momPlayer.name?"selected":""}>${esc(p.name)}</option>`).join("")}
        </select>
      </div>
    </div>
  ` : "";

  const printHeader = `
    <div class="print-only" style="margin-bottom:14px;">
      <div style="font-weight:800; font-size:17px;">${esc(state.teamAName)} vs ${esc(state.teamBName)}</div>
      <div style="font-size:11px; color:#444; margin-top:2px;">${state.oversLimit}-over match · ${esc(new Date().toLocaleDateString())}</div>
    </div>
  `;

  return `
    <canvas id="fireworksCanvas" class="fireworks-canvas no-print"></canvas>
    <main>
      ${printHeader}
      <div class="result-banner">
        <div class="rb-trophy">${tied ? "🤝" : "🏆"}</div>
        <div class="rb-eyebrow">Full time</div>
        <div class="rb-text">${esc(text)}</div>
      </div>
      <div class="card">
        <div style="font-weight:700; margin-bottom:10px">${esc(teamName(i1.battingKey))} ${i1.runs}/${i1.wickets} <span style="color:var(--ink-soft); font-weight:400">(${oversText(i1.legalBalls)} ov)</span> &nbsp;·&nbsp; ${esc(teamName(i2.battingKey))} ${i2.runs}/${i2.wickets} <span style="color:var(--ink-soft); font-weight:400">(${oversText(i2.legalBalls)} ov)</span></div>
      </div>
      ${momCard}
      <div class="card">${scorecardHtml(i1, "Innings 1", 0, state.extrasEnabled)}</div>
      <div class="card">${scorecardHtml(i2, "Innings 2", 1, state.extrasEnabled)}</div>
      <div class="no-print" style="display:flex; flex-direction:column; gap:8px;">
        <button class="btn btn-export" onclick="exportScorecard()">⬇ Export PDF</button>
        <button class="btn btn-primary" onclick="newMatch()">New match</button>
        <button class="btn-ghost" style="width:100%; padding:11px 12px;" onclick="openHistory()">📜 View all past matches</button>
      </div>
      ${copyrightLine()}
    </main>
    <footer class="no-print">This match is saved to your match history. Export PDF opens your browser's print dialog — choose "Save as PDF" as the destination.</footer>
  `;
}

    <div class="card history-card">
      <div class="history-top">
        <div class="history-teams">${esc(h.teamA)} vs ${esc(h.teamB)}</div>
        <div class="history-date">${h.date ? esc(new Date(h.date).toLocaleDateString()) : ""}</div>

      <div class="history-score">${h.i1.runs}/${h.i1.wickets} (${h.i1.overs}) &nbsp;·&nbsp; ${h.i2.runs}/${h.i2.wickets} (${h.i2.overs})</div>

    <footer>Stored on this device only.</footer>

}

      <p class="lede no-print">${entry.date ? esc(new Date(entry.date).toLocaleDateString())+" · " : ""}${esc(entry.resultText)}</p>

      <div class="no-print" style="display:flex; flex-direction:column; gap:8px;">
        <button class="btn btn-export" onclick="exportScorecard()">⬇ Export PDF</button>
        <button class="btn-ghost" style="width:100%; padding:11px 12px;" onclick="backToHistoryList()">← Back to history</button>
      </div>
      ${copyrightLine()}
    </main>
    <footer class="no-print">Read-only — this match has already finished.</footer>
  `;
}

function playBootAnimation(cb){
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduceMotion){ cb(); return; }
  let done = false;
  const finish = () => {
    if(done) return;
    done = true;
    cb();
  };
  const el = document.getElementById("bootSplash");
  if(el) el.addEventListener("click", finish, { once: true });
  setTimeout(finish, 1500);
}
playBootAnimation(render);

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
</script>
